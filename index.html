            <div className="px-3 pb-3 flex flex-col gap-3 overflow-y-auto" style={{ maxHeight: '60vh' }}>
              {items.length === 0 ? (<div className="text-center text-xs text-slate-400 py-8 px-2">{accent ? '把今天要專心做的任務放進來' : zoneKey === 'hold' ? '沒有暫緩中的任務' : '沒有未指定的任務'}</div>) : (items.map((t) => <FZCard key={t.id} task={t} zone={zoneKey} />))}
            </div>
          </div>
        );
      };
      return (
        <div className="w-full animate-in fade-in duration-300">
          <div className="flex items-start gap-2 mb-4 px-1"><Plus size={16} className="text-indigo-500 mt-0.5 shrink-0" /><p className="text-sm text-slate-600">把今天要專心做的放進「今日集中」，先擱著的放「暫緩」（點卡片上的按鈕移動即可）。</p></div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <Column zoneKey="focus" title="今日集中" icon={Zap} items={focusTasks} accent />
            <Column zoneKey="hold" title="暫緩" icon={PauseCircle} items={holdTasks} accent={false} />
            <Column zoneKey="none" title="未指定" icon={CheckCircle} items={noneTasks} accent={false} />
          </div>
        </div>
      );
    };

    // 便利貼回收桶：刪掉的便利貼可復原或永久刪除（依丟棄時間新到舊排序）
    const RecycleBin = ({ deletedNotes, setDeletedNotes, notes, setNotes }) => {
      const list = Array.isArray(deletedNotes) ? deletedNotes : [];
      const sorted = list.slice().sort((a, b) => {
        const va = new Date(a && a.deletedAt).getTime() || 0;
        const vb = new Date(b && b.deletedAt).getTime() || 0;
        return vb - va;
      });
      const fmt = (d) => { if (!d) return '—'; try { const dt = new Date(d); if (isNaN(dt.getTime())) return '—'; return dt.toLocaleString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return '—'; } };
      const restore = (note) => {
        const { deletedAt, ...rest } = note || {};
        setNotes([rest, ...(Array.isArray(notes) ? notes : [])]);
        setDeletedNotes(list.filter((n) => n && n.id !== note.id));
      };
      const purge = (note) => { setDeletedNotes(list.filter((n) => n && n.id !== note.id)); };
      const purgeAll = () => { if (window.confirm('確定要清空回收桶？此動作無法復原。')) setDeletedNotes([]); };
      return (
        <div className="w-full animate-in fade-in duration-300 pb-10">
          <div className="flex items-start justify-between gap-3 mb-4 px-1 flex-wrap">
            <div className="flex items-start gap-2"><Trash size={16} className="text-slate-500 mt-0.5 shrink-0" /><p className="text-sm text-slate-600">刪掉的便利貼會先放這裡，可以「復原」放回隨手筆記，或「永久刪除」。依丟棄時間新到舊排序。</p></div>
            {sorted.length > 0 && (<button type="button" onClick={purgeAll} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-red-50 text-red-600 hover:bg-red-100 transition-colors shrink-0"><Trash2 size={14} />清空回收桶</button>)}
          </div>
          {sorted.length === 0 ? (
            <div className="text-center text-sm text-slate-400 py-20 bg-white rounded-3xl border border-slate-200">回收桶是空的</div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
              {sorted.map((note) => (
                <div key={note.id} className={`p-5 rounded-3xl shadow-sm border border-black/5 flex flex-col gap-3 opacity-90 ${note.color || 'bg-yellow-100/70'}`}>
                  <p className="text-sm font-bold text-slate-700 break-words leading-relaxed whitespace-pre-wrap line-clamp-6" style={{ minHeight: '48px' }}>{note.text || '(空白便利貼)'}</p>
                  <div className="text-[11px] font-medium text-slate-500 space-y-0.5 border-t border-black/5 pt-2">
                    {note.tag && (<div>@ {note.tag}</div>)}
                    <div>建立：{fmt(note.createdAt)}</div>
                    <div>丟棄：{fmt(note.deletedAt)}</div>
                  </div>
                  <div className="flex items-center gap-2 pt-1">
                    <button type="button" onClick={() => restore(note)} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition-colors"><RotateCcw size={13} />復原</button>
                    <button type="button" onClick={() => purge(note)} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold bg-white/70 text-red-600 hover:bg-red-500 hover:text-white transition-colors"><Trash2 size={13} />永久刪除</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    function TaskManager({ uid, userEmail }) {
      const [activeView, setActiveView] = useState('board');
      const [searchQuery, setSearchQuery] = useState('');
      const [sheetSort, setSheetSort] = useState({ key: 'createdAt', dir: 'desc' }); // 任務總表排序
      const [sheetFilters, setSheetFilters] = useState({ status: [], category: [], period: [], assignee: [] }); // 任務總表 Excel 式欄位篩選（空=全部）
      const [openFilter, setOpenFilter] = useState(null); // 目前展開的篩選欄
      const [boardCompact, setBoardCompact] = useState(() => { try { return localStorage.getItem('mt_board_compact') !== '0'; } catch (e) { return true; } }); // 看板精簡/完整檢視（預設精簡：只看任務名+重點）
      const [isSidebarOpen, setIsSidebarOpen] = useState(() => (typeof window !== 'undefined' ? window.innerWidth >= 1024 : true));
      const [isLoaded, setIsLoaded] = useState(false);
      const autoBackupKey = 'mt_last_autobackup_' + (uid || 'anon');
      const autoBackupOnKey = 'mt_autobackup_on_' + (uid || 'anon');
      const [autoBackupOn, setAutoBackupOn] = useState(() => { try { return localStorage.getItem(autoBackupOnKey) !== '0'; } catch (e) { return true; } });
      const [lastAutoBackup, setLastAutoBackup] = useState(() => { try { return localStorage.getItem('mt_last_autobackup_' + (uid || 'anon')) || ''; } catch (e) { return ''; } });
      
      const [tasks, setTasks] = useState([]);
      const [projects, setProjects] = useState(DEFAULT_PROJECTS);
      const [users, setUsers] = useState(DEFAULT_USERS);
      const [notes, setNotes] = useState([]);
      const [knowledge, setKnowledge] = useState([]);
      const [deletedNotes, setDeletedNotes] = useState([]);
      const [boardColumns, setBoardColumns] = useState(DEFAULT_BOARD_COLUMNS);
      const noteDraftKey = 'mt_note_draft_' + (uid || 'anon');
      const [noteDraftSaved, setNoteDraftSaved] = useState(false);
      const [lightbox, setLightbox] = useState(null); // 放大檢視的圖片 dataURL
      const onboardedKey = 'mt_onboarded_' + (uid || 'anon');
      const [showWelcome, setShowWelcome] = useState(() => { try { return localStorage.getItem(onboardedKey) !== '1'; } catch (e) { return false; } });
      const dismissWelcome = () => { try { localStorage.setItem(onboardedKey, '1'); } catch (e) {} setShowWelcome(false); };

      // 貼圖：把壓縮後的圖片加進某張便利貼，加前檢查整份資料大小避免撐爆雲端單檔 1MB
      const addImageToNote = async (noteId, blob) => {
        try {
          const dataUrl = await compressImage(blob);
          setNotes(prev => {
            const cur = Array.isArray(prev) ? prev : [];
            const target = cur.find(n => n.id === noteId);
            if (!target) return cur;
            const nextImages = [...(Array.isArray(target.images) ? target.images : []), dataUrl];
            const candidate = cur.map(n => n.id === noteId ? { ...n, images: nextImages } : n);
            // 大小保護：預估整份 state JSON，超過 ~850KB 就擋下（Firestore 單文件上限 1MB）
            try {
              const approx = JSON.stringify({ ...buildLocalPayload(), notes: candidate }).length;
              if (approx > 850 * 1024) { window.alert('圖片太多了，為避免超過雲端單筆上限（會導致同步失敗），這張先不加。建議刪掉一些舊圖，或改用文字。'); return cur; }
            } catch (e) {}
            return candidate;
          });
        } catch (err) {
          window.alert('這張圖片處理失敗，請換一張試試。');
        }
      };
      const removeImageFromNote = (noteId, idx) => {
        setNotes(prev => (Array.isArray(prev) ? prev : []).map(n => {
          if (n.id !== noteId) return n;
          const imgs = (Array.isArray(n.images) ? n.images : []).filter((_, i) => i !== idx);
          return { ...n, images: imgs };
        }));
      };

      const [dialog, setDialog] = useState(null); 
      const [filterType, setFilterType] = useState('all'); 
      const [filterProject, setFilterProject] = useState('ALL'); 
      
      const [newTaskInput, setNewTaskInput] = useState('');
      const [newTaskType, setNewTaskType] = useState('work'); 
      const [newTaskProject, setNewTaskProject] = useState('ALL');
      const [newTaskPeriod, setNewTaskPeriod] = useState('不指定時段');
      const [newTaskDeadline, setNewTaskDeadline] = useState('');

      const [activeTimer, setActiveTimer] = useState(null);
      const [timerTick, setTimerTick] = useState(0);

      const [settingsNewUser, setSettingsNewUser] = useState('');
      const [settingsNewProject, setSettingsNewProject] = useState('');
      const [editingProject, setEditingProject] = useState(null);
      const [editingProjectName, setEditingProjectName] = useState('');

      const [statsRange, setStatsRange] = useState('thisWeek');
      const [statsSelectedCat, setStatsSelectedCat] = useState(null); // 統計圓環點擊看明細
      // 自訂查詢期間（YYYY-MM-DD），預設為今天
      const toDateInput = (d) => d.toLocaleDateString('sv-SE');   // sv-SE 會給出 YYYY-MM-DD 且用當地時間
      const [customStart, setCustomStart] = useState(() => toDateInput(new Date()));
      const [customEnd, setCustomEnd] = useState(() => toDateInput(new Date()));
      const [draggedNoteIndex, setDraggedNoteIndex] = useState(null);
      const fileInputRef = useRef(null);
      // 雲端同步用：
      const syncedJsonRef = useRef(null);   // 最後一次與雲端一致的內容（healed 後），避免多餘回寫
      const saveTimerRef = useRef(null);     // 去抖計時器
      const canWriteRef = useRef(false);     // 只有「成功讀過一次雲端」後才允許寫；讀失敗時保持 false，避免用空資料覆蓋雲端
      const lastWriteIdRef = useRef(null);   // 標記「這筆是我自己寫的」，用來精準略過自己的回音（比 JSON 比對可靠）
      const flushSaveRef = useRef(() => {}); // 指向最新的「立即存檔」函式，供關頁前 flush 呼叫
      const oversizeAlertedRef = useRef(false); // 已對「逼近 1MB 上限」提示過，避免每次都跳
      const localJsonRef = useRef(null);     // 目前本地內容快照（給 onSnapshot 判斷「本地是否有未同步變更」，避免 stale closure）
      const [syncStatus, setSyncStatus] = useState('idle'); // idle | saving | saved | error

      // 產生目前本地完整內容（供比對與寫入共用）
      const buildLocalPayload = () => {
        let catMap = {};
        try { catMap = JSON.parse(localStorage.getItem('taskflow_catmap') || '{}'); } catch (e) {}
        return { tasks, projects, users, notes, catMap, knowledge, deletedNotes, boardColumns };
      };

      // 每日自動備份：每天第一次載入（且已成功讀到雲端）→ (1) 本機留滾動快照（可靠，可還原） (2) 盡力下載一份 JSON 到電腦
      useEffect(() => {
        if (!isLoaded || !uid || !autoBackupOn) return;
        let today = '';
        try { today = new Date().toISOString().split('T')[0]; } catch (e) { return; }
        let last = '';
        try { last = localStorage.getItem(autoBackupKey) || ''; } catch (e) {}
        if (last === today) return;
        const payload = buildLocalPayload();
        // 資料還沒讀進來 → 先不備份，避免存到空檔
        if ((!payload.tasks || payload.tasks.length === 0) && (!payload.notes || payload.notes.length === 0)) return;
        // 先記「今日已嘗試」→ 無論後續快照/下載成功與否，今天都不再重跑
        // （修：快照塞爆 localStorage 時、日期記不上 → 每次改動都重觸發下載的洪水 bug）
        try { localStorage.setItem(autoBackupKey, today); } catch (e) {}
        const json = JSON.stringify({ ...payload, _autoBackupAt: new Date().toISOString() }, null, 2);
        // (1) 本機滾動快照：保留最近 3 天；localStorage 配額不足時逐步丟最舊的直到存得下
        let snapshotOk = false;
        try {
          const snapKey = 'mt_backup_snapshots_' + uid;
          let snaps = [];
          try { snaps = JSON.parse(localStorage.getItem(snapKey) || '[]'); } catch (e) { snaps = []; }
          snaps = snaps.filter(s => s && s.date !== today);
          snaps.push({ date: today, json });
          snaps = snaps.slice(-3);
          while (snaps.length) {
            try { localStorage.setItem(snapKey, JSON.stringify(snaps)); snapshotOk = true; break; }
            catch (e) { snaps.shift(); }   // 配額不足 → 丟最舊一份再試
          }
        } catch (e) { snapshotOk = false; }
        // (2) 盡力下載檔案到電腦（真瀏覽器會存到下載資料夾；被擋也不影響上面的本機快照）
        try {
          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `Mandy-Task-自動備份-${today}.json`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {}
        if (snapshotOk) setLastAutoBackup(today);
      }, [isLoaded, uid, autoBackupOn, tasks, notes]);

      // 立即把待寫資料寫回雲端（去抖到期、或關頁前 flush 都走這裡）
      flushSaveRef.current = () => {
        if (!uid || !canWriteRef.current) return;              // 尚未成功讀過雲端 → 絕不寫，避免覆蓋真資料
        if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); saveTimerRef.current = null; }
        const payload = buildLocalPayload();
        const localJson = JSON.stringify(payload);
        if (localJson === syncedJsonRef.current) return;       // 沒有實質變化
        // 大小保護：Firestore 單文件上限約 1MB（UTF-8 位元組）。逼近就擋下並提示，避免寫入靜默失敗後停止同步
        let bytes = localJson.length;
        try { bytes = new Blob([localJson]).size; } catch (e) {}
        if (bytes > 1000000) {
          setSyncStatus('error');
          if (!oversizeAlertedRef.current) { oversizeAlertedRef.current = true; window.alert('資料量已接近雲端單筆上限（約 1MB），新的變更暫時無法同步到雲端。\n請刪掉一些便利貼貼圖、或到「回收桶」按「清空回收桶」釋放空間，之後會自動恢復同步。'); }
          return;   // 不推進 syncedJsonRef → 釋放空間後會自動重試
        }
        oversizeAlertedRef.current = false;
        const prevSynced = syncedJsonRef.current;
        syncedJsonRef.current = localJson;                     // 樂觀推進，避免寫入在途期間重複觸發
        const writeId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        lastWriteIdRef.current = writeId;
        setSyncStatus('saving');
        setDoc(doc(fbDb, 'users', uid, 'state', 'main'), { ...payload, writeId, updatedAt: Date.now() })
          .then(() => setSyncStatus('saved'))
          .catch(e => {
            console.error("Sync save error:", e);
            setSyncStatus('error');
            // 寫入失敗 → 回滾基準，讓這筆變更之後會被重試，不致靜默遺失
            if (syncedJsonRef.current === localJson) syncedJsonRef.current = prevSynced;
            if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
            saveTimerRef.current = setTimeout(() => flushSaveRef.current(), 5000);
          });
      };

      // 雲端同步（讀）：訂閱這位使用者的資料，任何裝置的改動都即時同步過來。
      useEffect(() => {
        if (!uid) return;
        // 換使用者時重置同步狀態
        canWriteRef.current = false;
        lastWriteIdRef.current = null;
        syncedJsonRef.current = null;
        setSyncStatus('idle');
        const ref = doc(fbDb, 'users', uid, 'state', 'main');
        const unsub = onSnapshot(ref, (snap) => {
          // 自己剛寫、還沒落地伺服器的本地回音 → 略過
          if (snap.metadata && snap.metadata.hasPendingWrites) return;
          try {
            if (snap.exists()) {
              const d = snap.data() || {};
              // 若這筆正是我自己剛寫上去的（writeId 相符）→ state 已是最新，不需再套用
              // 本地已有尚未同步的變更（且非首次載入）→ 保留本地（正在編輯的內容不被遠端整包覆蓋、打字不被回捲）；本地變更會由去抖寫入推上雲端
              const localDirty = canWriteRef.current && localJsonRef.current && localJsonRef.current !== syncedJsonRef.current;
              if (!(d.writeId && d.writeId === lastWriteIdRef.current) && !localDirty) {
                const payload = {
                  tasks: Array.isArray(d.tasks) ? d.tasks : [],
                  projects: Array.isArray(d.projects) && d.projects.length ? d.projects : DEFAULT_PROJECTS,
                  users: Array.isArray(d.users) ? d.users : [],
                  notes: Array.isArray(d.notes) ? d.notes : [],
                  catMap: d.catMap || {},
                  knowledge: Array.isArray(d.knowledge) ? d.knowledge : [],
                  deletedNotes: Array.isArray(d.deletedNotes) ? d.deletedNotes : [],
                  boardColumns: normalizeColumns(d.boardColumns)
                };
                const healedTasks = payload.tasks.map(t => healTaskData(t));
                const mergedUsers = [...new Set([...DEFAULT_USERS, ...payload.users])];
                localStorage.setItem('taskflow_catmap', JSON.stringify(payload.catMap));
                setTasks(healedTasks);
                setProjects(payload.projects);
                setUsers(mergedUsers);
                setNotes(payload.notes);
                setKnowledge(payload.knowledge);
                setDeletedNotes(payload.deletedNotes);
                setBoardColumns(payload.boardColumns);
                // 記錄「已與雲端一致」的 healed 版本（key 順序須與 buildLocalPayload 一致），寫效果才不會多寫一次
                syncedJsonRef.current = JSON.stringify({ tasks: healedTasks, projects: payload.projects, users: mergedUsers, notes: payload.notes, catMap: payload.catMap, knowledge: payload.knowledge, deletedNotes: payload.deletedNotes, boardColumns: payload.boardColumns });
              }
            }
            // exists 或 not-exists（首次登入）都算「成功讀到」→ 之後才允許寫入
            canWriteRef.current = true;
            setSyncStatus(prev => prev === 'error' ? 'idle' : prev);
          } catch (e) {
            console.error("Sync load error:", e);
          }
          setIsLoaded(true);
        }, (err) => {
          // 讀失敗（暫時斷線 / 權限跳動）→ 不開放寫入，避免用空白覆蓋雲端真資料
          console.error("Firestore onSnapshot error:", err);
          setSyncStatus('error');
          setIsLoaded(true);   // 讓畫面顯示，但 canWriteRef 保持 false（不會亂寫）
        });
        return () => unsub();
      }, [uid]);

      // 雲端同步（寫）：資料變動 → 去抖 800ms 後寫回；只有成功讀過雲端才會寫。
      useEffect(() => {
        if (!isLoaded || !uid || !canWriteRef.current) return;
        const localJson = JSON.stringify(buildLocalPayload());
        localJsonRef.current = localJson;                       // 供 onSnapshot 判斷本地是否有未同步變更
        if (localJson === syncedJsonRef.current) return;         // 沒有實質變化
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(() => flushSaveRef.current(), 800);
        return () => { if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); } };
      }, [tasks, projects, users, notes, knowledge, deletedNotes, boardColumns, isLoaded, uid]);

      useEffect(() => {
        let interval = null;
        if (activeTimer) interval = setInterval(() => setTimerTick(prev => prev + 1), 60000);
        return () => clearInterval(interval);
      }, [activeTimer]);

      // 離開「看板／總表」時清空搜尋，避免切回來時任務被舊搜尋條件過濾掉、讓人誤以為任務不見
      useEffect(() => {
        if (activeView !== 'board' && activeView !== 'sheet' && activeView !== 'notes') setSearchQuery('');
      }, [activeView]);

      // 關頁面 / 切換 App / 鎖螢幕前，立即把待寫的最後一筆存回雲端（手機尤其重要）
      useEffect(() => {
        const onHide = () => { try { flushSaveRef.current(); } catch (e) {} };
        const onVis = () => { if (document.hidden) onHide(); };
        window.addEventListener('pagehide', onHide);
        document.addEventListener('visibilitychange', onVis);
        return () => {
          window.removeEventListener('pagehide', onHide);
          document.removeEventListener('visibilitychange', onVis);
        };
      }, []);

      const showDialog = (title, message, onConfirm, type = 'confirm') => {
        setDialog({ title, message, onConfirm, type, onCancel: () => setDialog(null) });
      };
      const closeDialog = () => setDialog(null);

      const addTask = (e) => {
        if (e.key === 'Enter' && newTaskInput.trim()) {
          const projToSave = newTaskType === 'work' ? (newTaskProject === 'ALL' ? '' : newTaskProject) : '';
          const newTask = {
            id: Date.now().toString(), text: newTaskInput.trim(), type: newTaskType,
            category: projToSave, period: newTaskPeriod, deadline: newTaskDeadline,
            status: 'todo', timeSpent: 0, logs: [], assignee: '', note: '',
            createdAt: new Date().toISOString()
          };
          setTasks([newTask, ...tasks]);
          setNewTaskInput('');
        }
      };

      const updateTask = useCallback((taskId, field, value) => {
        setTasks(prev => prev.map(t => t.id === taskId ? { ...t, [field]: value } : t));
      }, []);

      const deleteTask = useCallback((taskId) => {
        showDialog('刪除任務', '確定要永久刪除此任務嗎？此動作無法復原。', () => {
          setTasks(prev => prev.filter(t => t.id !== taskId));
          if(activeTimer === taskId) setActiveTimer(null);
          closeDialog();
        }, 'danger');
      }, [activeTimer]);

      const toggleStatus = useCallback((taskId, targetStatus) => {
        setTasks(prev => prev.map(t => t.id === taskId ? { ...t, status: targetStatus } : t));
      }, []);

      const toggleTimer = useCallback((taskId) => {
        setTasks(prev => {
          let currentTasks = [...prev];
          if (activeTimer) {
             currentTasks = currentTasks.map(t => {
                if (t.id === activeTimer) {
                  const lastLog = t.logs[t.logs.length - 1];
                  if (lastLog && !lastLog.end) {
                    const now = new Date();
                    const durationMins = Math.max(1, Math.floor((now - new Date(lastLog.start)) / 60000));
                    const updatedLogs = [...t.logs];
                    updatedLogs[updatedLogs.length - 1] = { ...lastLog, end: now.toISOString(), duration: durationMins };
                    const total = updatedLogs.reduce((acc, log) => acc + (isNaN(Number(log.duration)) ? 0 : Number(log.duration)), 0);
                    return { ...t, status: t.status === 'todo' ? 'in-progress' : t.status, logs: updatedLogs, timeSpent: total };
                  }
                }
                return t;
             });
          }
          if (activeTimer !== taskId) {
            currentTasks = currentTasks.map(t => {
              if (t.id === taskId) {
                const newLog = { id: Date.now().toString(), start: new Date().toISOString(), end: null, duration: 0, manual: false };
                return { ...t, status: t.status === 'todo' ? 'in-progress' : t.status, logs: [...(t.logs || []), newLog] };
              }
              return t;
            });
            setActiveTimer(taskId);
            setTimerTick(0);
          } else {
            setActiveTimer(null);
          }
          return currentTasks;
        });
      }, [activeTimer]);

      const addManualLog = useCallback((taskId, dateStr, durationStr, noteStr) => {
        const mins = parseInt(durationStr, 10);
        if (isNaN(mins) || mins <= 0) return;
        const logDate = new Date(dateStr);
        const now = new Date();
        logDate.setHours(now.getHours(), now.getMinutes());
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const newLog = { id: Date.now().toString(), start: logDate.toISOString(), end: logDate.toISOString(), duration: mins, manual: true, note: (noteStr || '').trim() };
            const updatedLogs = [...(t.logs || []), newLog];
            const total = updatedLogs.reduce((acc, log) => acc + (isNaN(Number(log.duration)) ? 0 : Number(log.duration)), 0);
            return { ...t, logs: updatedLogs, timeSpent: total };
          }
          return t;
        }));
      }, []);

      const deleteLog = useCallback((taskId, logId) => {
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const updatedLogs = (t.logs || []).filter(l => l.id !== logId);
            const total = updatedLogs.reduce((acc, log) => acc + (isNaN(Number(log.duration)) ? 0 : Number(log.duration)), 0);
            return { ...t, logs: updatedLogs, timeSpent: total };
          }
          return t;
        }));
      }, []);

      const handleExport = () => {
        let catMap = {};
        try { catMap = JSON.parse(localStorage.getItem('taskflow_catmap') || '{}'); } catch (e) {}
        const data = { tasks, projects, users, notes, catMap };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `TaskFlow_Backup_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            // 先寫入分類對照表，healTaskData 還原舊資料時才吃得到
            if(data.catMap) localStorage.setItem('taskflow_catmap', JSON.stringify(data.catMap));
            if(data.projects) setProjects(data.projects);
            else if (data.workCategories) {
                const mappedProjects = Object.entries(data.workCategories).map(([k, v], index) => {
                    const colors = ['#f43f5e', '#f97316', '#eab308', '#84cc16', '#10b981', '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', '#d946ef'];
                    return { id: k, name: v.label || k, color: colors[index % colors.length] };
                });
                setProjects(mappedProjects);
            }
            if(data.tasks) setTasks(data.tasks.map(t => healTaskData(t)));
            if(data.users) setUsers([...new Set([...DEFAULT_USERS, ...data.users])]);
            else if (data.managers) setUsers([...new Set([...DEFAULT_USERS, ...data.managers])]);
            if(data.notes) setNotes(data.notes);
          } catch(error) {
            alert('還原失敗，檔案格式可能錯誤: ' + error.message);
          }
          e.target.value = ''; 
        };
        reader.readAsText(file);
      };

      if (!isLoaded) return null;

      // 查詢任務：比對標題／備註／負責人／分類／狀態／截止日（不分大小寫）
      const STATUS_TEXT = { 'todo': '待辦', 'in-progress': '進行中', 'done': '已完成' };
      const matchesSearch = (t) => {
        if (!searchQuery.trim()) return true;
        const q = searchQuery.trim().toLowerCase();
        const hay = [t.text, t.note, t.assignee, t.category, STATUS_TEXT[t.status], t.deadline].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      };
      const searching = searchQuery.trim().length > 0;

      // 計時中置頂：正在計時的任務排到欄位最上面（其餘維持原順序，sort 為穩定排序）
      const orderColumn = (arr) => [...arr].sort((a, b) => (a.id === activeTimer ? -1 : 0) - (b.id === activeTimer ? -1 : 0));

      const renderBoard = () => {
        let filtered = tasks;
        if (filterType === 'uncat') filtered = filtered.filter(t => t.type === 'uncat' || !t.category);
        if (filterType === 'work') {
            filtered = filtered.filter(t => t.type === 'work' || t.category);
            if (filterProject !== 'ALL') filtered = filtered.filter(t => t.category === filterProject);
        }
        if (filterType === 'life') filtered = filtered.filter(t => t.type === 'life');

        filtered = filtered.filter(matchesSearch);

        // 一般檢視時，完成超過 7 天的任務自動隱藏；但「搜尋中」是主動查找 → 不隱藏，才找得到舊的已完成任務
        if (!searching) {
          const now = new Date();
          filtered = filtered.filter(t => {
             if (t.status === 'done') {
                let lastTime = new Date(t.createdAt);
                if (t.logs && t.logs.length > 0 && t.logs[t.logs.length - 1].end) lastTime = new Date(t.logs[t.logs.length - 1].end);
                return ((now - lastTime) / (1000 * 60 * 60 * 24)) <= 7;
             }
             return true;
          });
        }

        return (
          <div className="flex flex-col w-full h-full animate-in fade-in duration-300">
            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm mb-6 sticky top-0 z-20 w-full flex flex-col gap-4">
              <div className="flex relative">
                <input type="text" className="w-full bg-slate-50 text-slate-800 text-lg font-bold px-6 py-4 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all border border-slate-200 shadow-inner" placeholder="+ 把大腦清空！想到什麼就寫下來... (按 Enter 快速新增)" value={newTaskInput} onChange={(e) => setNewTaskInput(e.target.value)} onKeyDown={addTask} />
                <button onClick={() => addTask({key: 'Enter'})} className="absolute right-3 top-1/2 -translate-y-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-black px-6 py-2.5 rounded-xl transition-colors shadow-sm">記錄</button>
              </div>
              <div className="flex flex-wrap items-center gap-4 w-full px-2">
                 <div className="flex items-center gap-2 shrink-0">
                   <span className="text-sm font-black text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100 shadow-sm">建立並檢視 ➔</span>
                   <div className="flex bg-slate-100 p-1 rounded-xl">
                      <button onClick={() => {setNewTaskType('uncat'); setFilterType('uncat');}} className={`flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-sm font-bold transition-all ${newTaskType==='uncat'?'bg-white text-slate-800 shadow-sm':'text-slate-500 hover:text-slate-700'}`}>未分類</button>
                      <button onClick={() => {setNewTaskType('work'); setFilterType('work'); setFilterProject('ALL');}} className={`flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-sm font-bold transition-all ${newTaskType==='work'?'bg-white text-indigo-700 shadow-sm':'text-slate-500 hover:text-slate-700'}`}>工作專案</button>
                      <button onClick={() => {setNewTaskType('life'); setFilterType('life');}} className={`flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-sm font-bold transition-all ${newTaskType==='life'?'bg-white text-emerald-700 shadow-sm':'text-slate-500 hover:text-slate-700'}`}>生活個人</button>
                   </div>
                 </div>
                 {newTaskType === 'work' && (
                   <select className="bg-white border border-slate-200 text-slate-700 text-sm font-bold px-4 py-2 rounded-xl outline-none shadow-sm cursor-pointer min-w-[150px]" value={newTaskProject} onChange={(e) => {setNewTaskProject(e.target.value); setFilterProject(e.target.value);}}>
                     <option value="ALL">所有工作專案 (ALL)</option>
                     {projects.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                   </select>
                 )}
                 <div className="h-6 w-px bg-slate-300 hidden md:block"></div>
                 <div className="flex items-center gap-3">
                   <Clock className="w-4 h-4 text-slate-400" />
                   <select className="bg-white border border-slate-200 text-slate-700 text-sm font-bold px-4 py-2 rounded-xl outline-none shadow-sm cursor-pointer" value={newTaskPeriod} onChange={(e) => setNewTaskPeriod(e.target.value)}>
                     <option value="不指定時段">不指定時段</option><option value="上午">上午</option><option value="下午">下午</option><option value="晚上/下班">晚上/下班</option>
                   </select>
                 </div>
                 <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-sm ml-auto shrink-0">
                    <Calendar className="w-4 h-4 text-slate-400" />
                    <input type="date" className="text-sm font-bold text-slate-600 bg-transparent outline-none cursor-pointer" value={newTaskDeadline} onChange={(e) => setNewTaskDeadline(e.target.value)} />
                 </div>
                 <button onClick={() => setBoardCompact(v => { const nv = !v; try { localStorage.setItem('mt_board_compact', nv ? '1' : '0'); } catch (e) {} return nv; })} title={boardCompact ? '切換為完整檢視' : '切換為精簡檢視（只看標題與日期）'} className={`shrink-0 flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-bold border shadow-sm transition-colors ${boardCompact ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'}`}>
                    <ListIcon className="w-4 h-4" /> {boardCompact ? '精簡' : '完整'}
                 </button>
              </div>
            </div>
            {searching && filtered.length === 0 && (
              <div className="mb-6 bg-amber-50 border border-amber-200 rounded-2xl px-5 py-4 flex items-center justify-between gap-4">
                <span className="text-sm font-bold text-amber-800">找不到符合「{searchQuery}」的任務——換個關鍵字，或清除搜尋。</span>
                <button onClick={()=>setSearchQuery('')} className="shrink-0 text-sm font-black text-amber-700 hover:text-amber-900 underline">清除搜尋</button>
              </div>
            )}
            <div className="flex flex-col lg:flex-row gap-6 items-start w-full pb-10">
              {boardColumns.map((col, idx) => {
                const style = col.id === 'todo' ? { icon: Square, bg: 'bg-slate-50/80 border-slate-200', text: 'text-slate-700', iconColor: 'text-slate-400' }
                  : col.id === 'in-progress' ? { icon: Play, bg: 'bg-indigo-50/50 border-indigo-100', text: 'text-indigo-800', iconColor: 'text-indigo-500 fill-current' }
                  : col.id === 'done' ? { icon: CheckCircle, bg: 'bg-emerald-50/50 border-emerald-100 opacity-90', text: 'text-emerald-800', iconColor: 'text-emerald-500' }
                  : { icon: ListIcon, bg: 'bg-amber-50/40 border-amber-200', text: 'text-amber-800', iconColor: 'text-amber-500' };
                const knownIds = boardColumns.map(c => c.id);
                let data = filtered.filter(t => (t.status || 'todo') === col.id);
                if (idx === 0) data = data.concat(filtered.filter(t => !knownIds.includes(t.status || 'todo'))); // status 對不到任何欄位的任務歸第一欄，不讓它消失
                data = orderColumn(data);
                const Icon = style.icon;
                return (
                <div key={col.id} className={`flex-1 w-full flex flex-col gap-4 p-4 rounded-3xl border ${style.bg}`} onDragOver={e=>e.preventDefault()} onDrop={(e)=>{ const taskId = e.dataTransfer.getData('taskId'); if(taskId) toggleStatus(taskId, col.id); }}>
                  <div className="flex items-center justify-between px-2">
                    <h3 className={`text-lg font-black ${style.text} flex items-center gap-2`}><Icon className={`w-5 h-5 ${style.iconColor}`} /> {col.title}</h3>
                    <span className="bg-white text-slate-500 text-sm font-black px-3 py-1 rounded-full shadow-sm border border-slate-200">{data.length}</span>
                  </div>
                  <div className="flex flex-col gap-0 min-h-[200px]">
                     {data.map(task => (
                        <div key={task.id} draggable onDragStart={e=>e.dataTransfer.setData('taskId', task.id)}>
                          <TaskCard task={task} projects={projects} users={users} activeTimer={activeTimer} updateTask={updateTask} deleteTask={deleteTask} toggleStatus={toggleStatus} toggleTimer={toggleTimer} addManualLog={addManualLog} deleteLog={deleteLog} compact={boardCompact} />
                        </div>
                     ))}
                     {data.length === 0 && <div className="w-full h-32 border-2 border-dashed border-slate-200/60 rounded-2xl flex items-center justify-center text-slate-400 font-bold bg-white/50">{searching ? '查無符合' : '無任務或拖曳至此'}</div>}
                  </div>
                </div>
                );
              })}
            </div>
          </div>
        );
      };

      const renderNotes = () => {
        const noteColors = ['bg-pink-100/70', 'bg-yellow-100/70', 'bg-blue-100/70', 'bg-emerald-100/70', 'bg-purple-100/70'];
        return (
          <div className="w-full space-y-6 animate-in fade-in duration-300 pb-10">
            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col gap-4">
               <div className="flex flex-col gap-3 bg-yellow-50/50 p-4 rounded-2xl border border-yellow-200/70">
                  <div className="flex items-center gap-2 mb-2 text-yellow-600 font-black"><PenSquare className="w-5 h-5" /> 隨手筆記 & 交辦區</div>
                  <textarea className="w-full bg-transparent text-slate-800 text-lg font-bold outline-none resize-none placeholder-slate-400 min-h-[100px]" placeholder="隨手記下事情... (可以選擇顏色與相關人員)" id="newNoteInput" defaultValue={(typeof window !== 'undefined' && window.localStorage) ? (localStorage.getItem(noteDraftKey) || '') : ''} onChange={(e) => { try { localStorage.setItem(noteDraftKey, e.target.value); } catch (err) {} setNoteDraftSaved(e.target.value.trim().length > 0); }} />
                  {noteDraftSaved && (<div className="flex items-center gap-1 text-[11px] font-bold text-emerald-600 -mt-1"><Check className="w-3 h-3" /> 草稿已自動保存，離開頁面或關閉都不會不見</div>)}
                  <div className="flex flex-wrap items-center justify-between gap-3 border-t border-yellow-200/60 pt-3">
                     <div className="flex flex-wrap items-center gap-3">
                        <div className="flex items-center gap-2">
                           <span className="text-xs font-bold text-slate-500">緊急程度:</span>
                           <div className="flex gap-1.5" id="noteColorPicker">
                              {noteColors.map((c, i) => (
                                 <div key={c} className={`w-5 h-5 rounded-full cursor-pointer hover:scale-110 transition-transform ${c} border-2 border-white shadow-sm ring-1 ring-slate-200 ${i===1?'ring-offset-2 ring-indigo-500':''}`} onClick={(e) => {
                                    document.querySelectorAll('#noteColorPicker > div').forEach(el=>el.classList.remove('ring-offset-2', 'ring-indigo-500'));
                                    e.target.classList.add('ring-offset-2', 'ring-indigo-500');
                                    e.target.dataset.color = c;
                                 }} data-color={c}></div>
                              ))}
                           </div>
                        </div>
                        <div className="w-px h-4 bg-slate-300 hidden sm:block"></div>
                        <div className="flex items-center gap-2">
                           <span className="text-xs font-bold text-slate-500">@ 相關人員:</span>
                           <select id="noteUserSelect" className="bg-white border border-slate-200 text-xs font-bold px-2 py-1 rounded-lg outline-none cursor-pointer">
                              <option value="">- 無 -</option>{users.map(u=><option key={u} value={u}>{u}</option>)}
                           </select>
                        </div>
                     </div>
                     <button onClick={() => {
                        const text = document.getElementById('newNoteInput').value.trim();
                        if(text){
                           const colorEl = document.querySelector('#noteColorPicker > div.ring-indigo-500');
                           const color = colorEl ? colorEl.dataset.color : 'bg-yellow-100/70';
                           const tag = document.getElementById('noteUserSelect').value;
                           setNotes([{id: Date.now().toString(), text, color, tag, createdAt: new Date().toISOString()}, ...notes]);
                           document.getElementById('newNoteInput').value = '';
                           try { localStorage.removeItem(noteDraftKey); } catch (err) {}
                           setNoteDraftSaved(false);
                        }
                     }} className="bg-slate-800 hover:bg-slate-900 text-white font-black px-6 py-2 rounded-xl transition-colors shadow-sm text-sm">貼上便利貼</button>
                  </div>
               </div>
            </div>
            {searching && notes.filter(n => { const q = searchQuery.trim().toLowerCase(); return [n.text, n.tag].filter(Boolean).join(' ').toLowerCase().includes(q); }).length === 0 && (
              <div className="bg-amber-50 border border-amber-200 rounded-2xl px-5 py-4 text-sm font-bold text-amber-800">找不到符合「{searchQuery}」的便利貼。</div>
            )}
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
               {notes.map((note, index) => {
                  // 搜尋中：不符關鍵字的便利貼隱藏（用 return null 保留原索引，拖曳排序不受影響）
                  if (searching) { const q = searchQuery.trim().toLowerCase(); const hay = [note.text, note.tag].filter(Boolean).join(' ').toLowerCase(); if (!hay.includes(q)) return null; }
                  return (
                  <div key={note.id} draggable onDragStart={(e) => { setDraggedNoteIndex(index); e.dataTransfer.effectAllowed = "move"; }} onDragOver={(e) => e.preventDefault()} onDrop={(e) => {
                           e.preventDefault();
                           if (draggedNoteIndex === null || draggedNoteIndex === index) return;
                           const newNotes = [...notes];
                           const draggedItem = newNotes[draggedNoteIndex];
                           newNotes.splice(draggedNoteIndex, 1);
                           newNotes.splice(index, 0, draggedItem);
                           setNotes(newNotes);
                           setDraggedNoteIndex(null);
                       }}
                       className={`p-6 rounded-3xl shadow-sm hover:shadow-md transition-all relative group flex flex-col gap-4 cursor-grab active:cursor-grabbing border border-black/5 ${note.color || 'bg-yellow-100/70'}`}>
                     <textarea className="w-full flex-1 bg-transparent resize-none outline-none font-bold text-slate-800 overflow-y-auto leading-relaxed custom-scrollbar" style={{ minHeight: '120px', maxHeight: '260px' }} value={note.text} onChange={e => setNotes(notes.map(n => n.id === note.id ? {...n, text: e.target.value} : n))} onPaste={(e) => { const items = (e.clipboardData && e.clipboardData.items) ? e.clipboardData.items : []; for (let i = 0; i < items.length; i++) { if (items[i].type && items[i].type.indexOf('image') === 0) { const blob = items[i].getAsFile(); if (blob) { e.preventDefault(); addImageToNote(note.id, blob); } } } }} title="可直接貼上圖片（Ctrl+V）" />
                     {Array.isArray(note.images) && note.images.length > 0 && (
                       <div className="flex flex-wrap gap-2 pt-1">
                         {note.images.map((src, i) => (
                           <div key={i} className="relative group/img">
                             <img src={src} alt="貼圖" onClick={() => setLightbox(src)} className="w-16 h-16 object-cover rounded-lg border border-black/10 cursor-zoom-in shadow-sm" />
                             <button onClick={(e) => { e.stopPropagation(); removeImageFromNote(note.id, i); }} title="移除這張圖" className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-white rounded-full shadow flex items-center justify-center text-slate-400 hover:text-red-500 opacity-0 group-hover/img:opacity-100 transition-opacity"><X className="w-3 h-3" /></button>
                           </div>
                         ))}
                       </div>
                     )}
                     <div className="flex items-center justify-between mt-auto pt-4 border-t border-black/5">
                        <select className="text-xs font-black bg-white/60 px-2 py-1.5 rounded-lg text-slate-700 outline-none cursor-pointer hover:bg-white/80 transition-colors border-none shadow-sm" value={note.tag || ''} onChange={(e) => setNotes(notes.map(n => n.id === note.id ? {...n, tag: e.target.value} : n))}>
                           <option value="">- 無相關人員 -</option>{users.map(u => <option key={u} value={u}>@ {u}</option>)}
                        </select>
                        <div className="flex flex-col items-end gap-2">
                           <span className="text-[10px] font-bold text-slate-500">{new Date(note.createdAt).toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'})}</span>
                           <div className="flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                              {noteColors.map(c => <button key={c} onClick={()=> setNotes(notes.map(n => n.id === note.id ? {...n, color: c} : n))} className={`w-3.5 h-3.5 rounded-full ${c} border border-black/10 hover:scale-110`}></button>)}
                           </div>
                        </div>
                     </div>
                     <div className="absolute top-3 right-3 flex gap-1 opacity-0 group-hover:opacity-100 transition-all">
                        <button onClick={() => setNotes(notes.map(n => n.id === note.id ? { ...n, mailOutlook: !n.mailOutlook } : n))} title={note.mailOutlook ? '已標記：電腦上執行「Outlook草稿」程式時會用桌面 Outlook 開這則草稿（再點取消）' : '標記用桌面 Outlook 開草稿（執行 Outlook草稿程式時會開現場 Outlook，不用雲端版）'} className={`w-7 h-7 rounded-full flex items-center justify-center shadow-sm ${note.mailOutlook ? 'bg-indigo-600 text-white' : 'bg-white/60 hover:bg-indigo-500 hover:text-white text-slate-500'}`}><Mail className="w-3.5 h-3.5" /></button>
                        <button onClick={() => { if (!(note.text || '').trim()) return; if (window.confirm('把這則筆記送到匯報清單（會建立一則任務' + (note.tag ? '，匯報給 ' + note.tag : '') + '）？')) { setTasks([healTaskData({ id: Date.now().toString(), text: note.text, assignee: note.tag || '', status: 'todo', category: '', period: '不指定時段', createdAt: new Date().toISOString() }), ...tasks]); } }} title="送到匯報清單（建立任務）" className="w-7 h-7 bg-white/60 hover:bg-emerald-500 hover:text-white rounded-full flex items-center justify-center text-slate-500 shadow-sm"><Send className="w-3.5 h-3.5" /></button>
                        <button onClick={() => { setNotes(notes.filter(n => n.id !== note.id)); setDeletedNotes([{ ...note, deletedAt: new Date().toISOString() }, ...deletedNotes]); }} title="刪除（可到回收桶復原）" className="w-7 h-7 bg-white/60 hover:bg-red-500 hover:text-white rounded-full flex items-center justify-center text-slate-500 shadow-sm"><Trash2 className="w-3.5 h-3.5" /></button>
                     </div>
                  </div>
                  );
               })}
            </div>
            {lightbox && (
              <div className="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-6 cursor-zoom-out animate-in fade-in duration-150" onClick={() => setLightbox(null)}>
                <img src={lightbox} alt="放大檢視" className="max-w-full max-h-full rounded-lg shadow-2xl" onClick={(e) => e.stopPropagation()} />
                <button onClick={() => setLightbox(null)} className="absolute top-5 right-5 w-10 h-10 bg-white/90 rounded-full flex items-center justify-center text-slate-700 hover:bg-white shadow-lg" title="關閉"><X className="w-5 h-5" /></button>
              </div>
            )}
          </div>
        );
      };

      const renderReport = () => {
        const reportTasks = tasks.filter(t => t.assignee && t.assignee !== '' && t.assignee !== 'none' && t.status !== 'done');
        const reportGroups = ['All', ...users];
        const grouped = reportGroups.reduce((acc, user) => {
          acc[user] = reportTasks.filter(t => t.assignee === user);
          return acc;
        }, {});

        return (
          <div className="w-full space-y-8 animate-in fade-in duration-300 pb-10">
            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-3">
               <div className="bg-purple-100 p-2.5 rounded-xl"><MessageSquare className="w-6 h-6 text-purple-600" /></div>
               <div>
                  <h2 className="text-xl font-black text-slate-800">匯報清單 (One-on-One)</h2>
                  <p className="text-slate-500 font-bold mt-1 text-sm">自動過濾所有標記了「匯報對象」且尚未完成的任務。</p>
               </div>
            </div>
            {Object.entries(grouped).map(([user, userTasks]) => {
               if (userTasks.length === 0) return null;
               const displayName = user === 'All' ? 'All (所有主管)' : user;
               return (
                 <div key={user} className="flex flex-col gap-4">
                    <h3 className="text-lg font-black text-purple-800 flex items-center gap-2 border-b border-purple-100 pb-2"><User className="w-5 h-5" /> 匯報給：{displayName} <span className="bg-purple-100 text-purple-600 text-xs px-2 py-0.5 rounded-full">{userTasks.length}</span></h3>
                    <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                       {userTasks.map(task => <TaskCard key={task.id} task={task} projects={projects} users={users} activeTimer={activeTimer} updateTask={updateTask} deleteTask={deleteTask} toggleStatus={toggleStatus} toggleTimer={toggleTimer} addManualLog={addManualLog} deleteLog={deleteLog} />)}
                    </div>
                 </div>
               )
            })}
            {reportTasks.length === 0 && <div className="w-full py-12 text-center text-slate-400 font-bold bg-white rounded-3xl border border-dashed border-slate-200 shadow-sm">目前沒有需要匯報的任務</div>}
          </div>
        );
      };

      const renderSheet = () => {
        const setSort = (key) => setSheetSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' });
        const arrow = (key) => sheetSort.key === key ? (sheetSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
        const val = (t, k) => {
          if (k === 'timeSpent') return isNaN(Number(t.timeSpent)) ? 0 : Number(t.timeSpent);
          if (k === 'createdAt') return new Date(t.createdAt || 0).getTime();
          if (k === 'status') return ({ 'todo':0, 'in-progress':1, 'done':2 })[t.status] ?? 0;
          return (t[k] || '').toString();
        };
        // Excel 式欄位篩選：各欄可勾選要顯示的值（空陣列 = 不篩選）
        // 狀態標題依 boardColumns 動態解析（含自訂看板欄位），對不到才退回內建名稱
        const statusLabel = (s) => { const c = boardColumns.find(x => x.id === s); if (c) return c.title; return s === 'done' ? '已完成' : s === 'in-progress' ? '進行中' : '待辦'; };
        const distinct = (fn) => Array.from(new Set(tasks.map(fn).map(v => v == null ? '' : v))).sort((a, b) => String(a).localeCompare(String(b), 'zh-Hant'));
        const statusOptions = Array.from(new Set([...boardColumns.map(c => c.id), ...tasks.map(t => t.status || 'todo')]));
        const filterCols = {
          status: { label: '狀態', options: statusOptions, render: statusLabel, get: (t) => t.status || 'todo' },
          category: { label: '專案分類', options: distinct(t => t.category || ''), render: (v) => v || '無分類', get: (t) => t.category || '' },
          period: { label: '時段', options: distinct(t => t.period || '不指定時段'), render: (v) => v || '不指定時段', get: (t) => t.period || '不指定時段' },
          assignee: { label: '匯報給', options: distinct(t => t.assignee || ''), render: (v) => v || '（未設定）', get: (t) => t.assignee || '' },
        };
        const passFilter = (t) => Object.keys(filterCols).every(k => { const sel = sheetFilters[k]; return !sel || sel.length === 0 || sel.includes(filterCols[k].get(t)); });
        const activeFilterCount = Object.values(sheetFilters).reduce((n, arr) => n + ((arr && arr.length) ? 1 : 0), 0);
        const toggleFilterVal = (col, v) => setSheetFilters(prev => { const cur = prev[col] || []; const next = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v]; return { ...prev, [col]: next }; });
        const clearFilter = (col) => setSheetFilters(prev => ({ ...prev, [col]: [] }));
        const clearAllFilters = () => setSheetFilters({ status: [], category: [], period: [], assignee: [] });
        const rows = tasks.filter(matchesSearch).filter(passFilter).slice().sort((a, b) => {
          const va = val(a, sheetSort.key), vb = val(b, sheetSort.key);
          const cmp = (typeof va === 'number') ? (va - vb) : va.localeCompare(vb, 'zh-Hant');
          return sheetSort.dir === 'asc' ? cmp : -cmp;
        });
        const thc = "pb-3 cursor-pointer select-none hover:text-indigo-600 transition-colors";
        // 欄位篩選下拉（漏斗）
        const FilterHead = ({ col, extraTh }) => {
          const cfg = filterCols[col]; const sel = sheetFilters[col] || []; const on = openFilter === col;
          return (
            <span className="relative inline-flex items-center gap-1">
              <button type="button" onClick={(e) => { e.stopPropagation(); setOpenFilter(on ? null : col); }} title={`篩選${cfg.label}`} className={`inline-flex items-center justify-center w-5 h-5 rounded transition-colors ${sel.length ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:text-indigo-500 hover:bg-indigo-50'}`}><Filter className="w-3 h-3" /></button>
              {sel.length > 0 && <span className="text-[10px] font-black text-indigo-600">{sel.length}</span>}
              {on && (
                <>
                  <div className="fixed inset-0 z-40" onClick={(e) => { e.stopPropagation(); setOpenFilter(null); }}></div>
                  <div className="absolute top-6 left-0 z-50 bg-white border border-slate-200 rounded-xl shadow-xl p-2 w-52 max-h-64 overflow-y-auto custom-scrollbar cursor-default" onClick={(e) => e.stopPropagation()}>
                    <div className="flex items-center justify-between px-1 pb-1.5 mb-1 border-b border-slate-100">
                      <span className="text-xs font-black text-slate-500">篩選 {cfg.label}</span>
                      <button type="button" onClick={() => clearFilter(col)} className="text-[11px] font-bold text-indigo-500 hover:text-indigo-700">清除</button>
                    </div>
                    {cfg.options.length === 0 && <div className="text-xs text-slate-400 px-1 py-2">無資料</div>}
                    {cfg.options.map(opt => (
                      <label key={String(opt)} className="flex items-center gap-2 px-1.5 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">
                        <input type="checkbox" checked={sel.includes(opt)} onChange={() => toggleFilterVal(col, opt)} className="w-3.5 h-3.5 accent-indigo-600" />
                        <span className="text-xs font-bold text-slate-600 truncate">{cfg.render(opt)}</span>
                      </label>
                    ))}
                  </div>
                </>
              )}
            </span>
          );
        };
        return (
         <div className="bg-white rounded-3xl border border-slate-200 shadow-sm w-full p-6 animate-in fade-in pb-10">
            <div className="flex items-center justify-between mb-6 flex-wrap gap-2">
              <h2 className="text-xl font-black text-slate-800 flex items-center gap-2"><ListIcon className="w-6 h-6 text-indigo-500" /> 系統任務總表 <span className="text-xs font-bold text-slate-400">（點標題排序、點漏斗篩選）</span></h2>
              <div className="flex items-center gap-3">
                <span className="text-xs font-bold text-slate-400">顯示 {rows.length}/{tasks.filter(matchesSearch).length} 筆</span>
                {activeFilterCount > 0 && (<button type="button" onClick={clearAllFilters} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors"><X className="w-3.5 h-3.5" />清除全部篩選 ({activeFilterCount})</button>)}
              </div>
            </div>
            <div className="overflow-x-auto custom-scrollbar overflow-y-visible">
              <table className="w-full text-left border-collapse min-w-[1000px]">
                <thead>
                  <tr className="border-b-2 border-slate-200 text-slate-400 font-black text-sm">
                    <th className="pb-3 pl-4"><span className={thc} onClick={()=>setSort('status')}>狀態{arrow('status')}</span> <FilterHead col="status" /></th>
                    <th className={thc + " w-1/3"} onClick={()=>setSort('text')}>任務名稱{arrow('text')}</th>
                    <th className="pb-3"><span className={thc} onClick={()=>setSort('category')}>專案分類{arrow('category')}</span> <FilterHead col="category" /></th>
                    <th className="pb-3"><span className={thc} onClick={()=>setSort('period')}>時段{arrow('period')}</span> <FilterHead col="period" /></th>
                    <th className="pb-3"><span className={thc} onClick={()=>setSort('assignee')}>匯報給{arrow('assignee')}</span> <FilterHead col="assignee" /></th>
                    <th className={thc} onClick={()=>setSort('createdAt')}>建立日期{arrow('createdAt')}</th>
                    <th className={thc + " text-right pr-4"} onClick={()=>setSort('timeSpent')}>總投入 (分){arrow('timeSpent')}</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {rows.map(t => (
                    <tr key={t.id} className="hover:bg-slate-50 transition-colors group">
                      <td className="py-4 pl-4">{t.status === 'done' ? <span className="text-emerald-500 font-bold text-xs bg-emerald-50 px-2 py-1 rounded border border-emerald-100">已完成</span> : t.status === 'in-progress' ? <span className="text-indigo-500 font-bold text-xs bg-indigo-50 px-2 py-1 rounded border border-indigo-100">進行中</span> : (t.status && t.status !== 'todo' && boardColumns.find(c => c.id === t.status)) ? <span className="text-amber-600 font-bold text-xs bg-amber-50 px-2 py-1 rounded border border-amber-100">{statusLabel(t.status)}</span> : <span className="text-slate-400 font-bold text-xs bg-slate-100 px-2 py-1 rounded border border-slate-200">待辦</span>}</td>
                      <td className={`py-4 font-bold ${t.status==='done'?'text-slate-400 line-through':'text-slate-700'}`}>{t.text}</td>
                      <td className="py-4 font-bold text-sm" style={{color: projects.find(p=>p.name===t.category)?.color || '#94a3b8'}}>{t.category || '無分類'}</td>
                      <td className="py-4 font-bold text-slate-500 text-sm">{t.period}</td>
                      <td className="py-4 font-bold text-purple-600 text-sm">{t.assignee || '-'}</td>
                      <td className="py-4 font-bold text-slate-400 text-xs">{new Date(t.createdAt).toLocaleDateString()}</td>
                      <td className="py-4 font-black text-slate-600 text-right pr-4">{isNaN(Number(t.timeSpent))?0:t.timeSpent}</td>
                    </tr>
                  ))}
                  {rows.length === 0 && (
                    <tr><td colSpan="7" className="py-10 text-center text-slate-400 font-bold">
                      {searching ? `找不到符合「${searchQuery}」的任務` : activeFilterCount > 0 ? '沒有符合篩選條件的任務（點右上角清除篩選）' : '目前沒有任務'}
                    </td></tr>
                  )}
                </tbody>
              </table>
            </div>
         </div>
        );
      };

      const renderStats = () => {
        const getRangeDates = () => {
          const now = new Date();
          const start = new Date(now); const end = new Date(now);
          if (statsRange === 'custom') {
            // 自訂期間；若起訖顛倒則自動對調
            let a = customStart, b = customEnd;
            if (a > b) { const t = a; a = b; b = t; }
            const s = new Date(a + 'T00:00:00');
            const e = new Date(b + 'T00:00:00'); e.setHours(23,59,59,999);
            return { s, e };
          }
          if (statsRange === 'thisWeek' || statsRange === 'lastWeek') {
            // 一週定義為「週六 ～ 次週週五」。getDay(): 日=0…六=6
            const daysSinceSat = (now.getDay() + 1) % 7;
            const s = new Date(now);
            s.setDate(now.getDate() - daysSinceSat - (statsRange === 'lastWeek' ? 7 : 0));
            s.setHours(0,0,0,0);
            const e = new Date(s);
            e.setDate(s.getDate() + 6); e.setHours(23,59,59,999);
            return { s, e };
          }
          if (statsRange === 'thisMonth') {
            start.setDate(1); start.setHours(0,0,0,0);
            end.setMonth(start.getMonth() + 1); end.setDate(0); end.setHours(23,59,59,999);
          } else if (statsRange === 'lastMonth') {
            start.setMonth(start.getMonth() - 1); start.setDate(1); start.setHours(0,0,0,0);
            end.setDate(0); end.setHours(23,59,59,999);
          }
          return { s: start, e: end };
        };

        const rangeDates = statsRange === 'all' ? null : getRangeDates();

        let totalTime = 0, createdCount = 0, completedCount = 0;
        let categoryMap = {}; let rangeFilteredTasks = [];

        tasks.forEach(task => {
          let taskTimeInRange = 0;
          if (task.createdAt) {
             const cDate = new Date(task.createdAt);
             if (!rangeDates || (cDate >= rangeDates.s && cDate <= rangeDates.e)) createdCount++;
          }
          if (task.status === 'done') {
             let lastTime = new Date(task.createdAt || Date.now());
             if (task.logs && task.logs.length > 0 && task.logs[task.logs.length - 1].end) lastTime = new Date(task.logs[task.logs.length - 1].end);
             if (!rangeDates || (lastTime >= rangeDates.s && lastTime <= rangeDates.e)) completedCount++;
          }
          if (task.logs && task.logs.length > 0) {
             task.logs.forEach(log => {
                const logDur = isNaN(Number(log.duration)) ? 0 : Number(log.duration);
                if (logDur <= 0) return; 
                const logStart = new Date(log.start);
                if (!rangeDates || (logStart >= rangeDates.s && logStart <= rangeDates.e)) taskTimeInRange += logDur;
             });
          }
          if (taskTimeInRange > 0) {
             totalTime += taskTimeInRange;
             const catName = task.category || '未分類/其他';
             if (!categoryMap[catName]) {
                 const proj = projects.find(p => p.name === catName);
                 categoryMap[catName] = { name: catName, value: 0, color: proj ? proj.color : '#94a3b8' };
             }
             categoryMap[catName].value += taskTimeInRange;
             if(!rangeFilteredTasks.find(t=>t.id===task.id)) rangeFilteredTasks.push({ ...task, timeInRange: taskTimeInRange });
          }
        });

        const categoryStats = Object.values(categoryMap).sort((a,b) => b.value - a.value);
        const inProgressList = rangeFilteredTasks.filter(t => t.status !== 'done').sort((a,b) => b.timeInRange - a.timeInRange);
        const completedList = rangeFilteredTasks.filter(t => t.status === 'done').sort((a,b) => b.timeInRange - a.timeInRange);

        return (
          <div className="w-full space-y-6 pb-12 animate-in fade-in duration-300">
            <div className="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-3xl border border-slate-200 shadow-sm w-full">
               <div className="flex bg-slate-100 rounded-xl p-1 overflow-x-auto custom-scrollbar">
                 {['all','thisWeek','lastWeek','thisMonth','lastMonth','custom'].map(r => {
                    const labels = { all:'所有時間', thisWeek:'本週', lastWeek:'上週', thisMonth:'本月', lastMonth:'上月', custom:'自訂期間' };
                    return <button key={r} onClick={() => setStatsRange(r)} className={`px-4 py-2 text-sm font-bold rounded-lg transition-all whitespace-nowrap ${statsRange === r ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>{labels[r]}</button>
                 })}
               </div>
               <div className="flex flex-wrap items-center gap-3">
                  {statsRange === 'custom' && (
                     <div className="flex items-center gap-2 bg-indigo-50 px-3 py-2 rounded-xl border border-indigo-200">
                        <input type="date" value={customStart} max={customEnd}
                           onChange={(e) => setCustomStart(e.target.value)}
                           className="text-sm font-bold text-slate-700 bg-white px-2 py-1.5 rounded-lg border border-slate-200 outline-none focus:border-indigo-400" />
                        <span className="text-sm font-black text-slate-400">～</span>
                        <input type="date" value={customEnd} min={customStart}
                           onChange={(e) => setCustomEnd(e.target.value)}
                           className="text-sm font-bold text-slate-700 bg-white px-2 py-1.5 rounded-lg border border-slate-200 outline-none focus:border-indigo-400" />
                     </div>
                  )}
                  <div className="text-sm font-black text-slate-500 bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200 flex items-center gap-2 shadow-inner">
                     <Calendar className="w-4 h-4 text-indigo-500" />
                     {statsRange === 'all' ? '紀錄起始日 - 至今' : rangeDates ? `${rangeDates.s.toLocaleDateString()} - ${rangeDates.e.toLocaleDateString()}` : ''}
                  </div>
               </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
              {[ { label: '區間內建立任務', value: createdCount, color: 'text-slate-700' }, { label: '區間內完成任務', value: completedCount, color: 'text-emerald-500' }, { label: '區間投入總時間', value: `${Math.floor(totalTime / 60)}h ${totalTime % 60}m`, color: 'text-indigo-700' }
              ].map((kpi, idx) => (
                 <div key={idx} className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center">
                    <div className="text-sm font-black text-slate-400 mb-3 tracking-wide">{kpi.label}</div>
                    <div className={`text-5xl font-black tracking-tight ${kpi.color}`}>{kpi.value}</div>
                 </div>
              ))}
            </div>

            <div className="flex flex-col xl:flex-row gap-6 w-full items-start">
               <div className="w-full xl:w-[60%] flex flex-col gap-6">
                  <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm flex flex-col items-center justify-center w-full min-h-[550px]">
                     <h3 className="text-lg font-black text-slate-700 flex items-center gap-2 mb-6 w-full"><PieChartIcon className="w-5 h-5 text-indigo-600" /> 分類時間佔比 <span className="text-xs font-bold text-slate-400">（點圓環看該分類明細）</span></h3>
                     <div className="w-full h-[450px]">
                        {categoryStats.length > 0 && totalTime > 0 ? (
                           <SvgDonut data={categoryStats} onSliceClick={(d) => setStatsSelectedCat(prev => prev === d.name ? null : d.name)} />
                        ) : <div className="w-full h-full flex items-center justify-center text-slate-500/50 font-bold border-2 border-dashed border-slate-400/20 rounded-2xl">所選區間無時間紀錄</div>}
                     </div>
                  </div>
                  {statsSelectedCat && (() => {
                    const catTasks = rangeFilteredTasks.filter(t => t.category === statsSelectedCat && t.timeInRange > 0).sort((a, b) => b.timeInRange - a.timeInRange);
                    return (
                      <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm w-full animate-in fade-in duration-200">
                        <div className="flex items-center justify-between mb-3">
                          <h4 className="font-black text-slate-700 flex items-center gap-2"><span className="w-3 h-3 rounded-full" style={{backgroundColor: (categoryStats.find(c=>c.name===statsSelectedCat)||{}).color || '#94a3b8'}} />「{statsSelectedCat}」工作明細</h4>
                          <button onClick={() => setStatsSelectedCat(null)} className="text-slate-400 hover:text-slate-600" title="關閉"><X className="w-4 h-4" /></button>
                        </div>
                        <div className="space-y-1.5 max-h-72 overflow-y-auto pr-1">
                          {catTasks.length === 0 ? (<div className="text-center text-slate-400 py-4 font-bold">此分類本區間無時間紀錄</div>) : catTasks.map(t => (
                            <div key={t.id} className="flex items-center justify-between gap-3 px-3 py-2 rounded-xl bg-slate-50 text-sm">
                              <span className="font-bold text-slate-700 truncate">{t.text}</span>
                              <span className="font-black text-indigo-600 shrink-0">{t.timeInRange}m</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })()}
               </div>
               <div className="w-full xl:w-[40%] flex flex-col gap-6">
                   {[
                     { title: '進行中工作明細', icon: Play, data: inProgressList, color: 'blue', border: 'border-blue-200', bar: 'bg-blue-500', head: 'text-blue-800', ico: 'text-blue-500' },
                     { title: '已完成工作明細', icon: CheckCircle, data: completedList, color: 'emerald', border: 'border-emerald-200', bar: 'bg-emerald-500', head: 'text-emerald-800', ico: 'text-emerald-500' }
                   ].map(list => (
                     <div key={list.title} className={`bg-white p-6 rounded-3xl border ${list.border} shadow-sm flex flex-col w-full relative overflow-hidden flex-1 min-h-[263px]`}>
                       <div className={`absolute top-0 left-0 w-full h-1.5 ${list.bar}`} />
                       <h3 className={`text-lg font-black ${list.head} mb-6 flex items-center gap-2`}><list.icon className={`w-5 h-5 ${list.ico} ${list.icon===Play?'fill-current':''}`} /> {list.title}</h3>
                       <div className="w-full overflow-x-auto custom-scrollbar">
                         <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead>
                               <tr className="border-b border-slate-100 text-slate-400 font-bold">
                                 <th className="pb-3 pr-4 font-normal">任務名稱</th><th className="pb-3 pr-4 font-normal">分類</th><th className="pb-3 text-right font-normal">投入</th>
                               </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-50">
                               {list.data.map(t => (
                                  <tr key={t.id} className="hover:bg-slate-50 transition-colors">
                                    <td className="py-3 pr-4 font-bold text-slate-700 truncate max-w-[150px]" title={t.text}>{t.text}</td>
                                    <td className="py-3 pr-4 text-xs font-bold text-slate-500">{t.category || '-'}</td>
                                    <td className={`py-3 text-right font-black ${list.color==='blue'?'text-blue-700':'text-emerald-600'}`}>{t.timeInRange}m</td>
                                  </tr>
                               ))}
                               {list.data.length === 0 && <tr><td colSpan="3" className="py-8 text-center text-slate-400 font-bold bg-slate-50/50 rounded-xl mt-2">無時間紀錄</td></tr>}
                            </tbody>
                         </table>
                       </div>
                     </div>
                   ))}
               </div>
            </div>
          </div>
        );
      };

      const renderSettings = () => {
          const handleAddProject = () => {
             if(settingsNewProject.trim() && !projects.find(p=>p.name===settingsNewProject.trim())) {
