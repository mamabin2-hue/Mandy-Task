<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow 任務管理系統</title>
  
  <!-- 載入 Tailwind CSS (網頁排版引擎) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入自訂捲軸樣式 -->
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; border: 3px solid transparent; background-clip: content-box; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    body { font-family: "Microsoft JhengHei", "微軟正黑體", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; }
  </style>

  <!-- 設定 React 與相關套件的載入路徑 -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      }
    }
  </script>
  
  <!-- 載入 Babel (瀏覽器端編譯引擎) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- React 系統掛載點 -->
  <div id="root"></div>

  <!-- 系統核心程式碼 -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      LayoutDashboard, List as ListIcon, PenSquare, MessageSquare, BarChart2, 
      Settings, BookOpen, Plus, Search, Filter, Calendar, Clock, User, 
      Trash2, Edit2, Play, Square, CheckCircle, ChevronDown, PieChart as PieChartIcon, 
      AlignLeft, Download, Upload, Info, X, Check, FileText, AlertTriangle, TrendingUp, Copy, Zap, PauseCircle
    } from 'lucide-react';
    import { initializeApp } from 'firebase/app';
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from 'firebase/auth';
    import { getFirestore, doc, onSnapshot, setDoc } from 'firebase/firestore';

    // Firebase 連線設定（apiKey 為網頁版公開金鑰，安全由 Firestore 規則 + 登入控管）
    const firebaseConfig = {
      apiKey: "AIzaSyAV5rrga_uiGLK5xVgf2_K1EpqIegUzHfs",
      authDomain: "mandy-task.firebaseapp.com",
      projectId: "mandy-task",
      storageBucket: "mandy-task.firebasestorage.app",
      messagingSenderId: "58753516929",
      appId: "1:58753516929:web:bd333c261ff65f991d9480"
    };
    const fbApp = initializeApp(firebaseConfig);
    const fbAuth = getAuth(fbApp);
    const fbDb = getFirestore(fbApp);

    // 系統預設資料
    // ⚠️ 此檔案會公開在 GitHub，請勿在此寫入真實人名或子公司名稱。
    //    實際的成員名單／專案分類請用「設定」頁新增，或匯入 seed.json（不上傳）。
    const DEFAULT_PROJECTS = [
      { id: 'p1', name: '工作分類一', color: '#8b5cf6' },
      { id: 'p2', name: '工作分類二', color: '#d946ef' },
      { id: 'p3', name: '工作分類三', color: '#06b6d4' },
      { id: 'p4', name: '會議/報告', color: '#3b82f6' },
      { id: 'p5', name: '專案企劃與執行', color: '#10b981' }
    ];
    const DEFAULT_USERS = [];

    // 舊資料 subCategoryId → 分類名稱的對照表。
    // 內建僅保留不敏感的通用鍵值；完整對照表由 seed.json 匯入後存進 localStorage。
    const BUILTIN_CAT_MAP = {
      'hr': '工作分類一', 'meeting': '會議/報告',
      'project': '專案企劃與執行', 'admin': '工作分類三'
    };
    const getCatMap = () => {
      try {
        const saved = localStorage.getItem('taskflow_catmap');
        return saved ? { ...BUILTIN_CAT_MAP, ...JSON.parse(saved) } : BUILTIN_CAT_MAP;
      } catch (e) { return BUILTIN_CAT_MAP; }
    };

    // 資料相容與修復引擎
    const healTaskData = (task) => {
      const text = task.text || task.title || task.name || '';
      let status = task.status;
      if (status === 'doing') status = 'in-progress';
      if (!status) status = 'todo';
      
      let assignee = task.assignee;
      if (!assignee || assignee === 'none') {
          assignee = (task.reportTo && task.reportTo !== 'none') ? task.reportTo : '';
      }
      if (assignee === '- 尚未設定 -') assignee = '';

      let period = task.period;
      if (!period) {
          const timeMap = { 'morning': '上午', 'afternoon': '下午', 'evening': '晚上/下班', 'none': '不指定時段' };
          period = timeMap[task.timeBlock] || task.timeBlock || '不指定時段';
      }

      let category = task.category;
      if (!category && task.subCategoryId) {
          category = getCatMap()[task.subCategoryId] || task.subCategoryId;
      }
      if(!category) category = '';

      let logs = task.logs || [];
      if (logs.length === 0 && task.workLogs && Array.isArray(task.workLogs)) {
          logs = task.workLogs.map(wl => ({
              id: wl.id || Date.now().toString() + Math.random().toString(),
              start: wl.date || new Date().toISOString(),
              end: wl.date || new Date().toISOString(),
              duration: isNaN(Number(wl.duration)) ? (isNaN(Number(wl.spent)) ? 0 : Number(wl.spent)) : Number(wl.duration),
              manual: true
          }));
      }
      logs = logs.map(l => ({ ...l, duration: isNaN(Number(l.duration)) ? 0 : Number(l.duration) }));

      let timeSpent = logs.reduce((acc, log) => acc + log.duration, 0);
      if (timeSpent === 0 && task.timeSpent) {
          timeSpent = isNaN(Number(task.timeSpent)) ? 0 : Number(task.timeSpent);
      }

      return { ...task, id: task.id || Date.now().toString(), text, status, assignee, period, category, logs, timeSpent, createdAt: task.createdAt || new Date().toISOString(), deadline: task.deadline || '' };
    };

    // 任務卡片元件
    const TaskCard = React.memo(({ task, projects, users, activeTimer, updateTask, deleteTask, toggleStatus, toggleTimer, addManualLog, deleteLog }) => {
      const isRunning = activeTimer === task.id;
      const projectInfo = projects.find(p => p.name === task.category);
      const projectColor = projectInfo?.color || '#cbd5e1';

      // 到期提醒：依截止日與今天的差距決定顏色（逾期紅／今明橙／3天內黃）
      const dueInfo = (() => {
        if (!task.deadline || (task.status || '').includes('done')) return null;
        const today = new Date(); today.setHours(0,0,0,0);
        const d = new Date(task.deadline + 'T00:00:00'); if (isNaN(d)) return null;
        const days = Math.round((d - today) / 86400000);
        if (days < 0) return { cls: 'text-rose-700 bg-rose-50 border-rose-200', label: `逾期${-days}天`, dot: 'bg-rose-500' };
        if (days === 0) return { cls: 'text-rose-700 bg-rose-50 border-rose-200', label: '今天到期', dot: 'bg-rose-500' };
        if (days === 1) return { cls: 'text-orange-700 bg-orange-50 border-orange-200', label: '明天到期', dot: 'bg-orange-500' };
        if (days <= 3) return { cls: 'text-amber-700 bg-amber-50 border-amber-200', label: `${days}天內`, dot: 'bg-amber-500' };
        return null;
      })();
      
      const [manualDate, setManualDate] = useState(new Date().toISOString().split('T')[0]);
      const [manualMins, setManualMins] = useState('');
      const [manualNote, setManualNote] = useState('');

      const titleRef = useRef(null);
      const noteRef = useRef(null);

      const stopDrag = (e) => { e.stopPropagation(); };
      const stopDragAndDrop = (e) => { e.stopPropagation(); e.preventDefault(); };

      const adjustHeight = (el) => {
        if (el) {
          el.style.height = 'auto';
          el.style.height = el.scrollHeight + 'px';
        }
      };

      useEffect(() => { adjustHeight(titleRef.current); }, [task.text]);
      useEffect(() => { adjustHeight(noteRef.current); }, [task.note]);

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col group transition-all hover:shadow-md w-full relative mb-4 overflow-visible" style={{ borderTopWidth: '6px', borderTopColor: projectColor }}>
          <div className="flex items-center justify-between p-3 border-b border-slate-100 bg-slate-50/80 rounded-t-xl">
             <div className="flex flex-wrap items-center gap-2 flex-1 pr-2">
               <div className="relative group/sel">
                 <select className="appearance-none bg-white border border-slate-200 text-xs font-black py-1.5 pl-3 pr-7 rounded-full shadow-sm outline-none cursor-pointer hover:border-slate-300 transition-colors max-w-[160px] truncate" style={{ color: projectColor }} value={task.category || ''} onClick={stopDrag} onDragStart={stopDragAndDrop} onChange={(e) => updateTask(task.id, 'category', e.target.value)}>
                   <option value="">- 變更專案 -</option>
                   {projects.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                 </select>
                 <ChevronDown className="w-3 h-3 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none opacity-50" style={{ color: projectColor }} />
               </div>
               
               <div className="relative group/sel">
                 <select className="appearance-none bg-white border border-slate-200 text-slate-500 text-xs font-bold py-1.5 pl-3 pr-7 rounded-full shadow-sm outline-none cursor-pointer hover:border-slate-300 transition-colors" value={task.period || '不指定時段'} onClick={stopDrag} onDragStart={stopDragAndDrop} onChange={(e) => updateTask(task.id, 'period', e.target.value)}>
                   <option value="不指定時段">不指定時段</option><option value="上午">上午</option><option value="下午">下午</option><option value="晚上/下班">晚上/下班</option>
                 </select>
                 <ChevronDown className="w-3 h-3 text-slate-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none" />
               </div>
             </div>
             <button onClick={(e) => { e.stopPropagation(); deleteTask(task.id); }} onDragStart={stopDragAndDrop} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 transition-colors shrink-0">
                <Trash2 className="w-4 h-4" />
             </button>
          </div>

          <div className="p-4 flex flex-col gap-3">
            <textarea ref={titleRef} className="w-full text-base font-black text-slate-800 bg-transparent border-none outline-none resize-none placeholder-slate-300 overflow-hidden" style={{ minHeight: '32px' }} value={task.text || ''} onClick={stopDrag} onDragStart={stopDragAndDrop} onInput={(e) => adjustHeight(e.target)} onChange={(e) => updateTask(task.id, 'text', e.target.value)} placeholder="輸入任務名稱..." />

            <div className="flex flex-col gap-0 border border-purple-100 rounded-xl overflow-hidden bg-purple-50/20">
               <div className="flex items-center justify-between w-full p-2 bg-purple-50 border-b border-purple-100">
                 <div className="flex items-center gap-1.5 text-purple-600 text-xs font-black px-2"><User className="w-3.5 h-3.5" /> 匯報對象</div>
                 <div className="relative flex-1 max-w-[140px]">
                   <select className="w-full appearance-none bg-white border border-purple-200 text-purple-700 text-xs font-bold py-1 pl-3 pr-7 rounded-lg outline-none cursor-pointer hover:border-purple-300 transition-colors" value={task.assignee || ''} onClick={stopDrag} onDragStart={stopDragAndDrop} onChange={(e) => updateTask(task.id, 'assignee', e.target.value)}>
                     <option value="">- 尚未設定 -</option><option value="All">All (所有主管)</option>
                     {users.map(u => <option key={u} value={u}>{u}</option>)}
                   </select>
                   <ChevronDown className="w-3 h-3 text-purple-500 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" />
                 </div>
               </div>
               <textarea ref={noteRef} className="w-full text-sm font-bold text-slate-600 bg-yellow-50/80 p-3 outline-none resize-none placeholder-slate-400 focus:bg-yellow-100/50 transition-colors overflow-hidden leading-relaxed" style={{ minHeight: '60px' }} value={task.note || ''} onClick={stopDrag} onDragStart={stopDragAndDrop} onInput={(e) => adjustHeight(e.target)} onChange={(e) => updateTask(task.id, 'note', e.target.value)} placeholder="點此直接輸入備註、交辦事項..." />
            </div>

            <div className="mt-2 flex flex-col gap-2 pt-3 border-t border-slate-100">
              <div className="text-xs font-bold text-slate-400 flex items-center gap-1.5"><Clock className="w-3.5 h-3.5" /> 投入歷程與補登</div>
              <div className="flex flex-col gap-2 w-full">
                <div className="flex items-center gap-2 w-full">
                 <input type="date" className="flex-1 bg-slate-50 border border-slate-200 text-slate-600 text-xs font-bold px-2 py-1.5 rounded-lg outline-none cursor-pointer" value={manualDate} onChange={e => setManualDate(e.target.value)} onClick={stopDrag} onDragStart={stopDragAndDrop} />
                 <input type="number" placeholder="分鐘" className="w-[60px] bg-slate-50 border border-slate-200 text-slate-600 text-xs font-bold px-2 py-1.5 rounded-lg outline-none" value={manualMins} onChange={e => setManualMins(e.target.value)} onClick={stopDrag} onDragStart={stopDragAndDrop} />
                 <button onClick={(e) => { e.stopPropagation(); addManualLog(task.id, manualDate, manualMins, manualNote); setManualMins(''); setManualNote(''); }} onDragStart={stopDragAndDrop} className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-colors shrink-0 shadow-sm">+ 補登</button>
                </div>
                <input type="text" placeholder="這段時間做了什麼？(選填備註)" className="w-full bg-slate-50 border border-slate-200 text-slate-600 text-xs font-bold px-2 py-1.5 rounded-lg outline-none" value={manualNote} onChange={e => setManualNote(e.target.value)} onClick={stopDrag} onDragStart={stopDragAndDrop} />
              </div>

              <div className="flex flex-col gap-1 mt-1 max-h-[140px] overflow-y-auto custom-scrollbar pr-1">
                 {task.logs && task.logs.map((log, idx) => {
                   const isCurrent = isRunning && !log.end && idx === task.logs.length - 1;
                   const rawDur = isCurrent ? Math.max(1, Math.floor((new Date() - new Date(log.start))/60000)) : Number(log.duration);
                   const dur = isNaN(rawDur) ? 0 : rawDur;
                   if (dur === 0 && !isCurrent) return null; 
                   const dateObj = new Date(log.start);
                   const dateLabel = isNaN(dateObj) ? '未知時間' : dateObj.toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit' });
                   return (
                     <div key={log.id || idx} className={`text-[11px] font-bold px-2 py-1.5 rounded-lg flex justify-between items-center group/log ${isCurrent ? 'bg-indigo-50 text-indigo-700 border border-indigo-100 animate-pulse' : 'bg-slate-50 text-slate-500 hover:bg-slate-100 transition-colors'}`}>
                       <span className="truncate" title={log.note || ''}>{dateLabel} {log.manual ? '(補)' : ''}{log.note ? ` · ${log.note}` : ''}</span>
                       <div className="flex items-center gap-2">
                         <span className={isCurrent ? 'text-indigo-600 font-black' : 'text-indigo-500'}>+{dur}m</span>
                         {!isCurrent && (
                            <button onClick={(e) => { e.stopPropagation(); deleteLog(task.id, log.id); }} onDragStart={stopDragAndDrop} className="w-5 h-5 rounded-full text-slate-400 opacity-0 group-hover/log:opacity-100 hover:bg-red-100 hover:text-red-500 flex items-center justify-center transition-all" title="刪除此紀錄"><Trash2 className="w-3 h-3" /></button>
                         )}
                       </div>
                     </div>
                   )
                 })}
              </div>
            </div>
          </div>

          <div className="p-3 bg-slate-50/80 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 rounded-b-xl">
             {task.status === 'done' ? (
                <div className="flex items-center gap-1.5 text-emerald-600 font-black text-sm px-3 py-2 bg-emerald-100/50 rounded-xl flex-1 justify-center border border-emerald-100 cursor-pointer hover:bg-emerald-200/50 transition-colors shadow-sm" onClick={(e)=>{ e.stopPropagation(); toggleStatus(task.id, 'todo'); }} title="點擊退回待辦">
                  <CheckCircle className="w-4 h-4" /> 已完成結案
                </div>
             ) : (
                <button onClick={(e) => { e.stopPropagation(); toggleTimer(task.id); }} onDragStart={stopDragAndDrop} className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-xl font-black text-sm transition-all shadow-sm ${isRunning ? 'bg-indigo-600 text-white shadow-indigo-200' : 'bg-white text-indigo-600 border border-indigo-200 hover:bg-indigo-50'}`}>
                  {isRunning ? <><Square className="w-4 h-4 fill-current" /> 暫停</> : <><Play className="w-4 h-4 fill-current" /> 開始</>}
                </button>
             )}
             
             {!(task.status || '').includes('done') && (
               <div className="flex items-center gap-2 shrink-0">
                 <div className={`flex items-center gap-1.5 px-2 py-1.5 rounded-lg border font-bold text-xs shadow-sm group/date relative ${dueInfo ? dueInfo.cls : 'text-slate-500 bg-white border-slate-200'}`}>
                   <Calendar className={`w-3.5 h-3.5 ${dueInfo ? '' : 'text-slate-400'}`} />
                   <input type="date" className="bg-transparent outline-none w-[105px] cursor-pointer" value={task.deadline || ''} onChange={(e) => updateTask(task.id, 'deadline', e.target.value)} onClick={stopDrag} onDragStart={stopDragAndDrop} />
                   {dueInfo && <span className="whitespace-nowrap flex items-center gap-1"><span className={`w-1.5 h-1.5 rounded-full ${dueInfo.dot} animate-pulse`}></span>{dueInfo.label}</span>}
                 </div>
                 <div className="flex items-center gap-1 text-indigo-700 bg-indigo-50 px-2.5 py-1.5 rounded-lg font-black text-sm border border-indigo-100 shadow-sm justify-center min-w-[60px]" title="系統自動計算總時數">
                   <Clock className="w-3.5 h-3.5 opacity-70" />
                   {isNaN(Number(task.timeSpent)) ? 0 : task.timeSpent} <span className="text-[10px] font-bold">m</span>
                 </div>
               </div>
             )}
          </div>
        </div>
      );
    });
    TaskCard.displayName = 'TaskCard';

    // 純 SVG 圓環圖（取代 recharts，避免 CDN 相依問題）
    const polarXY = (cx, cy, r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    const SvgDonut = ({ data, onSliceClick }) => {
      const cx = 200, cy = 200, rOut = 112, rIn = 72;
      const items = data.filter(d => (d.value || 0) > 0);
      const total = items.reduce((s, d) => s + d.value, 0);
      if (!total) return null;
      const clip = (n) => (n && n.length > 9 ? n.slice(0, 8) + '…' : n);
      const clickProps = (d) => ({ onClick: () => onSliceClick && onSliceClick(d), style: { cursor: onSliceClick ? 'pointer' : 'default' } });

      // 只有一個分類（100%）：整條弧起訖點重合會整個消失 → 直接畫一整圈
      if (items.length === 1) {
        const d0 = items[0];
        return (
          <svg viewBox="-60 0 520 400" className="w-full h-full">
            <circle cx={cx} cy={cy} r={(rOut + rIn) / 2} fill="none" stroke={d0.color} strokeWidth={rOut - rIn} {...clickProps(d0)}>
              <title>{`${d0.name}：${d0.value} 分鐘 (100%)`}</title>
            </circle>
            <text x={cx} y={cy - 8} textAnchor="middle" fill={d0.color} fontSize="16" fontWeight="900">{clip(d0.name)}</text>
            <text x={cx} y={cy + 22} textAnchor="middle" fill={d0.color} fontSize="26" fontWeight="900">100%</text>
          </svg>
        );
      }

      const gap = 0.03;
      let angle = -Math.PI / 2;
      const segs = items.map((d) => {
        const frac = d.value / total;
        const sweep = frac * Math.PI * 2;
        const useGap = sweep > gap * 1.5 ? gap : 0;    // 極小分類不套間隙，避免弧線反向渲染成錯誤扇形
        const a0 = angle + useGap / 2, a1 = angle + sweep - useGap / 2;
        angle += sweep;
        const [ox0, oy0] = polarXY(cx, cy, rOut, a0);
        const [ox1, oy1] = polarXY(cx, cy, rOut, a1);
        const [ix1, iy1] = polarXY(cx, cy, rIn, a1);
        const [ix0, iy0] = polarXY(cx, cy, rIn, a0);
        const large = (a1 - a0) > Math.PI ? 1 : 0;
        const path = `M ${ox0} ${oy0} A ${rOut} ${rOut} 0 ${large} 1 ${ox1} ${oy1} L ${ix1} ${iy1} A ${rIn} ${rIn} 0 ${large} 0 ${ix0} ${iy0} Z`;
        const mid = (a0 + a1) / 2;
        const [lx, ly] = polarXY(cx, cy, rOut + 26, mid);
        return { d, path, lx, ly, pct: Math.round(frac * 100) };
      });
      return (
        <svg viewBox="-60 0 520 400" className="w-full h-full">
          {segs.map((s, i) => (
            <g key={i} {...clickProps(s.d)}>
              <path d={s.path} fill={s.d.color}>
                <title>{`${s.d.name}：${s.d.value} 分鐘 (${s.pct}%)`}</title>
              </path>
              <text x={s.lx} y={s.ly} fill={s.d.color} textAnchor={s.lx > cx ? 'start' : 'end'} dominantBaseline="central" fontSize="14" fontWeight="900">
                <tspan x={s.lx} dy="-0.6em">{clip(s.d.name)}</tspan>
                <tspan x={s.lx} dy="1.6em" fontSize="22">{s.pct}%</tspan>
              </text>
            </g>
          ))}
        </svg>
      );
    };

    // CEO 進度儀表板（純呈現元件，無狀態；由平行 Agent 產出、整合時已回歸測試）
    const CeoDashboard = ({ tasks, projects }) => {
      const T = Array.isArray(tasks) ? tasks : [];
      const P = Array.isArray(projects) ? projects : [];
      const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
      const safeDate = (v) => { if (!v) return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; };
      const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const fmtHours = (min) => { const h = num(min) / 60; return (Math.round(h * 10) / 10).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); };
      const fmtMD = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
      const now = new Date();
      const today0 = startOfDay(now);
      const weekStart = startOfDay(new Date(today0));
      weekStart.setDate(weekStart.getDate() - ((now.getDay() + 1) % 7));
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 7);
      const total = T.length;
      const doneCount = T.filter((t) => t && t.status === 'done').length;
      const inProgCount = T.filter((t) => t && t.status === 'in-progress').length;
      const todoCount = T.filter((t) => t && t.status === 'todo').length;
      const completeRate = total ? Math.round((doneCount / total) * 100) : 0;
      const isOverdue = (t) => { if (!t || t.status === 'done') return false; const dl = safeDate(t.deadline); return dl ? startOfDay(dl) < today0 : false; };
      const overdueCount = T.filter(isOverdue).length;
      let weekMinutes = 0;
      T.forEach((t) => { const logs = t && Array.isArray(t.logs) ? t.logs : []; logs.forEach((lg) => { const s = safeDate(lg && lg.start); if (s && s >= weekStart && s < weekEnd) weekMinutes += num(lg.duration); }); });
      const projStats = P.map((p) => { const name = (p && p.name) || ''; const ts = T.filter((t) => t && t.category === name); const dn = ts.filter((t) => t.status === 'done').length; return { id: (p && p.id) != null ? p.id : name, name, color: (p && p.color) || '#6366f1', tot: ts.length, done: dn, pct: ts.length ? Math.round((dn / ts.length) * 100) : 0 }; }).filter((x) => x.tot > 0).sort((a, b) => b.tot - a.tot);
      const soonLimit = new Date(today0); soonLimit.setDate(soonLimit.getDate() + 3);
      const dueList = T.filter((t) => { if (!t || t.status === 'done') return false; const dl = safeDate(t.deadline); if (!dl) return false; return startOfDay(dl) <= soonLimit; }).map((t) => { const dl = startOfDay(safeDate(t.deadline)); const diffDays = Math.round((dl - today0) / 86400000); return { t, dl, diffDays }; }).sort((a, b) => a.diffDays - b.diffDays);
      const days = [];
      for (let i = 6; i >= 0; i--) { const d = new Date(today0); d.setDate(d.getDate() - i); days.push({ date: d, key: dayKey(d), min: 0 }); }
      const dayMap = {}; days.forEach((d) => (dayMap[d.key] = d));
      T.forEach((t) => { const logs = t && Array.isArray(t.logs) ? t.logs : []; logs.forEach((lg) => { const s = safeDate(lg && lg.start); if (!s) return; const k = dayKey(startOfDay(s)); if (dayMap[k]) dayMap[k].min += num(lg.duration); }); });
      const maxDayMin = Math.max(1, ...days.map((d) => d.min));

      const CARD = 'bg-white rounded-3xl border border-slate-200 shadow-sm';
      const Empty = ({ text }) => (<div className="flex items-center justify-center h-full min-h-[120px] text-slate-400 text-sm font-bold">{text || '本區間無資料'}</div>);
      const KpiCard = ({ Icon, label, value, sub, tone }) => (
        <div className={`${CARD} p-4 flex flex-col gap-2`}>
          <div className="flex items-center gap-2 text-slate-500">
            <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${tone || 'bg-indigo-50 text-indigo-600'}`}><Icon className="w-4 h-4" /></div>
            <span className="text-xs font-bold">{label}</span>
          </div>
          <div className="text-2xl font-black text-slate-800 leading-none">{value}</div>
          {sub ? <div className="text-[11px] font-bold text-slate-400">{sub}</div> : null}
        </div>
      );
      const StatusDonut = () => {
        const segs = [ { name: '待辦', value: todoCount, color: '#94a3b8' }, { name: '進行中', value: inProgCount, color: '#6366f1' }, { name: '已完成', value: doneCount, color: '#22c55e' } ].filter((s) => s.value > 0);
        const sum = segs.reduce((a, s) => a + s.value, 0);
        if (!sum) return <Empty text="尚無任務" />;
        const cx = 90, cy = 90, rOut = 78, rIn = 50;
        const polar = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
        let body;
        if (segs.length === 1) { const s0 = segs[0]; body = (<circle cx={cx} cy={cy} r={(rOut + rIn) / 2} fill="none" stroke={s0.color} strokeWidth={rOut - rIn} />); }
        else {
          let angle = -Math.PI / 2; const gap = 0.04;
          body = segs.map((s, i) => {
            const frac = s.value / sum; const sweep = frac * Math.PI * 2; const useGap = sweep > gap * 1.5 ? gap : 0;
            const a0 = angle + useGap / 2, a1 = angle + sweep - useGap / 2; angle += sweep;
            const [ox0, oy0] = polar(rOut, a0); const [ox1, oy1] = polar(rOut, a1); const [ix1, iy1] = polar(rIn, a1); const [ix0, iy0] = polar(rIn, a0);
            const large = (a1 - a0) > Math.PI ? 1 : 0;
            const d = `M ${ox0} ${oy0} A ${rOut} ${rOut} 0 ${large} 1 ${ox1} ${oy1} L ${ix1} ${iy1} A ${rIn} ${rIn} 0 ${large} 0 ${ix0} ${iy0} Z`;
            return (<path key={i} d={d} fill={s.color}><title>{`${s.name}：${s.value} (${Math.round(frac * 100)}%)`}</title></path>);
          });
        }
        return (
          <div className="flex flex-col sm:flex-row items-center gap-4">
            <svg viewBox="0 0 180 180" className="w-40 h-40 shrink-0">
              {body}
              <text x={cx} y={cy - 6} textAnchor="middle" fontSize="26" fontWeight="900" fill="#1e293b">{completeRate}%</text>
              <text x={cx} y={cy + 16} textAnchor="middle" fontSize="11" fontWeight="700" fill="#94a3b8">完成率</text>
            </svg>
            <div className="flex flex-col gap-2 w-full">
              {[ { name: '待辦', value: todoCount, color: '#94a3b8' }, { name: '進行中', value: inProgCount, color: '#6366f1' }, { name: '已完成', value: doneCount, color: '#22c55e' } ].map((s, i) => (
                <div key={i} className="flex items-center gap-2 text-sm">
                  <span className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: s.color }} />
                  <span className="font-bold text-slate-600 flex-1">{s.name}</span>
                  <span className="font-black text-slate-800">{s.value}</span>
                  <span className="text-slate-400 font-bold w-12 text-right">{sum ? Math.round((s.value / sum) * 100) : 0}%</span>
                </div>
              ))}
            </div>
          </div>
        );
      };
      const TrendBars = () => {
        if (days.every((d) => d.min <= 0)) return <Empty text="近 7 天尚無投入紀錄" />;
        const W = 420, H = 160, padB = 26, padT = 10, padX = 8; const n = days.length; const bw = (W - padX * 2) / n;
        return (
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-44" preserveAspectRatio="xMidYMid meet">
            {days.map((d, i) => {
              const h = (d.min / maxDayMin) * (H - padB - padT); const x = padX + i * bw; const y = H - padB - h; const isToday = d.key === dayKey(today0);
              return (
                <g key={i}>
                  <rect x={x + bw * 0.18} y={y} width={bw * 0.64} height={Math.max(0, h)} rx="5" fill={isToday ? '#4f46e5' : '#a5b4fc'}><title>{`${fmtMD(d.date)}：${fmtHours(d.min)} 小時`}</title></rect>
                  {d.min > 0 && (<text x={x + bw / 2} y={y - 4} textAnchor="middle" fontSize="10" fontWeight="800" fill="#6366f1">{fmtHours(d.min)}</text>)}
                  <text x={x + bw / 2} y={H - padB + 16} textAnchor="middle" fontSize="10" fontWeight="700" fill={isToday ? '#4f46e5' : '#94a3b8'}>{fmtMD(d.date)}</text>
                </g>
              );
            })}
          </svg>
        );
      };
      return (
        <div className="w-full max-w-full space-y-5 animate-in fade-in duration-300 pb-12">
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
            <KpiCard Icon={BarChart2} label="總任務數" value={total} sub="全部任務" />
            <KpiCard Icon={CheckCircle} label="完成率" value={`${completeRate}%`} sub={`${doneCount} / ${total} 完成`} tone="bg-green-50 text-green-600" />
            <KpiCard Icon={Clock} label="進行中" value={inProgCount} sub="in-progress" tone="bg-indigo-50 text-indigo-600" />
            <KpiCard Icon={AlertTriangle} label="逾期" value={overdueCount} sub="已過期未完成" tone={overdueCount ? 'bg-red-50 text-red-600' : 'bg-slate-100 text-slate-500'} />
            <KpiCard Icon={TrendingUp} label="本週投入" value={`${fmtHours(weekMinutes)}h`} sub={`${fmtMD(weekStart)}~${fmtMD(new Date(weekEnd - 86400000))}`} tone="bg-sky-50 text-sky-600" />
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div className={`${CARD} p-5 lg:col-span-2`}>
              <h3 className="text-base font-black text-slate-800 mb-4 flex items-center gap-2"><BarChart2 className="w-5 h-5 text-indigo-600" /> 各專案完成率</h3>
              {projStats.length === 0 ? <Empty text="尚無專案任務" /> : (
                <div className="space-y-3">
                  {projStats.map((p) => (
                    <div key={p.id}>
                      <div className="flex items-center justify-between text-sm mb-1">
                        <span className="font-bold text-slate-700 truncate pr-2" style={{ minWidth: 0 }}>{p.name || '（未命名）'}</span>
                        <span className="font-black text-slate-800 shrink-0">{p.done}/{p.tot}・{p.pct}%</span>
                      </div>
                      <div className="w-full h-3 rounded-full bg-slate-100 overflow-hidden">
                        <div className="h-full rounded-full transition-all" style={{ width: `${p.pct}%`, backgroundColor: p.color }} />
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div className={`${CARD} p-5`}>
              <h3 className="text-base font-black text-slate-800 mb-4 flex items-center gap-2"><PieChartIcon className="w-5 h-5 text-indigo-600" /> 狀態分布</h3>
              <StatusDonut />
            </div>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div className={`${CARD} p-5`}>
              <h3 className="text-base font-black text-slate-800 mb-4 flex items-center gap-2"><Calendar className="w-5 h-5 text-indigo-600" /> 逾期與即將到期（3 天內）</h3>
              {dueList.length === 0 ? <Empty text="太棒了，沒有逾期或即將到期的任務" /> : (
                <div className="space-y-2 overflow-y-auto max-h-72 pr-1">
                  {dueList.map(({ t, dl, diffDays }, i) => {
                    const late = diffDays < 0;
                    return (
                      <div key={t.id != null ? t.id : i} className="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50 border border-slate-100">
                        <span className={`w-2 h-2 rounded-full shrink-0 ${late ? 'bg-red-500' : diffDays === 0 ? 'bg-amber-500' : 'bg-indigo-400'}`} />
                        <div className="flex-1 min-w-0">
                          <div className="font-bold text-slate-800 text-sm truncate">{(t && t.text) || '（無標題）'}</div>
                          <div className="text-[11px] font-bold text-slate-400 truncate">{(t && t.category) || '未分類'}・{fmtMD(dl)}</div>
                        </div>
                        <span className={`text-xs font-black shrink-0 px-2 py-1 rounded-lg ${late ? 'bg-red-100 text-red-600' : diffDays === 0 ? 'bg-amber-100 text-amber-600' : 'bg-indigo-100 text-indigo-600'}`}>{late ? `逾期 ${Math.abs(diffDays)} 天` : diffDays === 0 ? '今天到期' : `剩 ${diffDays} 天`}</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
            <div className={`${CARD} p-5`}>
              <h3 className="text-base font-black text-slate-800 mb-4 flex items-center gap-2"><TrendingUp className="w-5 h-5 text-indigo-600" /> 近 7 天每日投入時數</h3>
              <TrendBars />
            </div>
          </div>
        </div>
      );
    };

    // 每日/週計劃（唯讀視圖，內部 UI 狀態，不寫外部資料；平行 Agent 產出，整合時已回歸測試）
    const WeekPlanner = ({ tasks, projects, onOpenDay }) => {
      const [mode, setMode] = React.useState('week');
      const [weekOffset, setWeekOffset] = React.useState(0);
      const [dayOffset, setDayOffset] = React.useState(0);
      const WD = ['日', '一', '二', '三', '四', '五', '六'];
      const PERIODS = ['上午', '下午', '晚上/下班', '不指定時段'];
      const safeTasks = Array.isArray(tasks) ? tasks : [];
      const safeProjects = Array.isArray(projects) ? projects : [];
      const parseDeadline = (s) => { if (!s || typeof s !== 'string') return null; const d = new Date(s + 'T00:00:00'); return isNaN(d.getTime()) ? null : d; };
      const dayKey = (d) => (d instanceof Date && !isNaN(d.getTime())) ? `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` : null;
      const fmtMD = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
      const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
      const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
      const today = startOfDay(new Date());
      const todayKey = dayKey(today);
      const thisSaturday = addDays(today, -((today.getDay() + 1) % 7));
      const weekStart = addDays(thisSaturday, weekOffset * 7);
      const weekDays = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
      const colorOf = (cat) => { if (!cat) return '#6366f1'; const p = safeProjects.find((x) => x && (x.id === cat || x.name === cat)); return (p && p.color) ? p.color : '#6366f1'; };
      const StatusIcon = ({ status }) => { if (status === 'done') return <CheckCircle size={12} className="text-emerald-500 shrink-0" />; if (status === 'in-progress') return <Play size={12} className="text-amber-500 shrink-0" />; return <Square size={12} className="text-slate-400 shrink-0" />; };
      const statusText = (s) => s === 'done' ? '完成' : s === 'in-progress' ? '進行中' : '待辦';
      const byDay = {};
      safeTasks.forEach((t) => { if (!t) return; const d = parseDeadline(t.deadline); const k = dayKey(d); if (!k) return; (byDay[k] = byDay[k] || []).push(t); });
      const tasksOnDay = (d) => byDay[dayKey(d)] || [];
      const weekTotal = weekDays.reduce((n, d) => n + tasksOnDay(d).length, 0);
      const PTaskCard = ({ t }) => (
        <div className="flex items-start gap-1.5 px-2 py-1.5 rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-100 transition-colors">
          <span className="mt-1 w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: colorOf(t.category) }} />
          <div className="min-w-0 flex-1">
            <div className="text-xs font-medium text-slate-700 truncate">{t.text || '(未命名任務)'}</div>
            <div className="flex items-center gap-1 mt-0.5 text-[10px] text-slate-400">
              <StatusIcon status={t.status} />
              <span className="truncate">{(t.period && t.period !== '不指定時段') ? t.period : statusText(t.status)}</span>
            </div>
          </div>
        </div>
      );
      const navBtn = "p-1.5 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition-colors";
      const modeBtn = (active) => `px-3 py-1.5 text-xs font-medium rounded-xl transition-colors ${active ? 'bg-indigo-600 text-white' : 'text-slate-500 hover:bg-slate-100'}`;
      const WeekView = () => (
        <div>
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <div className="flex items-center gap-2">
              <button className={navBtn} onClick={() => setWeekOffset((v) => v - 1)} aria-label="上一週"><ChevronDown size={16} className="rotate-90" /></button>
              <button className="px-3 py-1.5 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50" onClick={() => setWeekOffset(0)}>本週</button>
              <button className={navBtn} onClick={() => setWeekOffset((v) => v + 1)} aria-label="下一週"><ChevronDown size={16} className="-rotate-90" /></button>
              <span className="text-xs text-slate-500 ml-1">{fmtMD(weekDays[0])} ~ {fmtMD(weekDays[6])}</span>
            </div>
            <span className="text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl font-medium">本週合計 {weekTotal} 件到期</span>
          </div>
          <div className="overflow-x-auto -mx-1 px-1">
            <div className="grid grid-cols-7 gap-2 min-w-[720px]">
              {weekDays.map((d, i) => {
                const list = tasksOnDay(d);
                const isToday = dayKey(d) === todayKey;
                return (
                  <div key={i} className={`rounded-2xl border p-2 flex flex-col ${isToday ? 'border-indigo-300 bg-indigo-50/40' : 'border-slate-200 bg-slate-50/40'}`}>
                    <div className={`text-center pb-2 mb-2 border-b ${isToday ? 'border-indigo-200' : 'border-slate-200'}`}>
                      <div className={`text-[11px] ${isToday ? 'text-indigo-500 font-semibold' : 'text-slate-400'}`}>週{WD[d.getDay()]}</div>
                      <div className={`text-sm font-bold ${isToday ? 'text-indigo-600' : 'text-slate-600'}`}>{fmtMD(d)}</div>
                    </div>
                    <div className="space-y-1.5 overflow-y-auto max-h-[300px] pr-0.5">
                      {list.length === 0 ? <div className="text-center text-[10px] text-slate-300 py-4">無到期</div> : list.map((t, j) => <PTaskCard key={t.id || j} t={t} />)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
      const DayView = () => {
        const day = addDays(today, dayOffset);
        const isToday = dayOffset === 0;
        const list = tasksOnDay(day);
        const grouped = PERIODS.map((p) => ({ period: p, items: list.filter((t) => { const per = (t && t.period) || '不指定時段'; return per === p; }) }));
        return (
          <div>
            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
              <div className="flex items-center gap-2">
                <button className={navBtn} onClick={() => setDayOffset((v) => v - 1)} aria-label="前一天"><ChevronDown size={16} className="rotate-90" /></button>
                <button className="px-3 py-1.5 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50" onClick={() => setDayOffset(0)}>今天</button>
                <button className={navBtn} onClick={() => setDayOffset((v) => v + 1)} aria-label="後一天"><ChevronDown size={16} className="-rotate-90" /></button>
                <span className={`text-sm font-bold ml-1 ${isToday ? 'text-indigo-600' : 'text-slate-600'}`}>{fmtMD(day)}（週{WD[day.getDay()]}）{isToday && <span className="text-[11px] font-medium text-indigo-400 ml-1">今天</span>}</span>
              </div>
              <span className="text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl font-medium">共 {list.length} 件到期</span>
            </div>
            <p className="text-xs text-slate-500 mb-3 flex items-center gap-1.5"><Clock size={13} className="text-indigo-400" />{isToday ? '今天預計要完成的事：' : '這天預計要完成的事：'}</p>
            <div className="grid gap-3 md:grid-cols-2">
              {grouped.map((g, i) => (
                <div key={i} className="rounded-2xl border border-slate-200 bg-slate-50/40 p-3">
                  <div className="text-xs font-semibold text-slate-500 mb-2 flex items-center justify-between"><span>{g.period}</span><span className="text-[10px] text-slate-400">{g.items.length} 件</span></div>
                  <div className="space-y-1.5 overflow-y-auto max-h-[220px] pr-0.5">
                    {g.items.length === 0 ? <div className="text-center text-[10px] text-slate-300 py-3">無安排</div> : g.items.map((t, j) => <PTaskCard key={t.id || j} t={t} />)}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };
      return (
        <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-4 sm:p-6 animate-in fade-in duration-300">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
            <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2"><Calendar size={20} className="text-indigo-500" /> 每日/週計劃</h2>
            <div className="flex items-center gap-1 bg-slate-100 rounded-2xl p-1">
              <button className={modeBtn(mode === 'week')} onClick={() => setMode('week')}>週檢視</button>
              <button className={modeBtn(mode === 'day')} onClick={() => setMode('day')}>當日檢視</button>
            </div>
          </div>
          {mode === 'week' ? <WeekView /> : <DayView />}
        </div>
      );
    };

    // 知識管理（簡化版 OneNote；透過 setKnowledge 回拋，外層負責雲端同步。平行 Agent 產出，整合時已回歸測試）
    const KnowledgeBase = ({ knowledge, setKnowledge }) => {
      const pages = Array.isArray(knowledge) ? knowledge : [];
      const [activeCat, setActiveCat] = React.useState('__ALL__');
      const [query, setQuery] = React.useState('');
      const [editing, setEditing] = React.useState(null);
      const [collapsed, setCollapsed] = React.useState(false);
      const [fTitle, setFTitle] = React.useState('');
      const [fCat, setFCat] = React.useState('');
      const [fContent, setFContent] = React.useState('');
      const s = (v) => (typeof v === 'string' ? v : v == null ? '' : String(v));
      const fmtDate = (v) => { const n = typeof v === 'number' ? v : Number(v); if (!n || isNaN(n)) return '—'; const d = new Date(n); if (isNaN(d.getTime())) return '—'; return d.toLocaleDateString(); };
      const categories = React.useMemo(() => { const set = []; pages.forEach((p) => { const c = s(p && p.category).trim(); if (c && set.indexOf(c) === -1) set.push(c); }); return set.sort((a, b) => a.localeCompare(b)); }, [pages]);
      const filtered = React.useMemo(() => {
        const q = query.trim().toLowerCase();
        return pages.filter((p) => p && typeof p === 'object')
          .filter((p) => activeCat === '__ALL__' ? true : s(p.category).trim() === activeCat)
          .filter((p) => !q ? true : (s(p.title).toLowerCase().indexOf(q) !== -1 || s(p.content).toLowerCase().indexOf(q) !== -1))
          .sort((a, b) => (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0));
      }, [pages, activeCat, query]);
      const openNew = () => { setFTitle(''); setFCat(activeCat !== '__ALL__' ? activeCat : ''); setFContent(''); setEditing('NEW'); };
      const openEdit = (p) => { setFTitle(s(p.title)); setFCat(s(p.category)); setFContent(s(p.content)); setEditing(p); };
      const save = () => {
        const title = fTitle.trim(); const category = fCat.trim(); const content = fContent;
        if (!title) { alert('請輸入標題'); return; }
        const now = Date.now(); let next;
        if (editing === 'NEW') { const id = 'kb_' + now + '_' + Math.random().toString(36).slice(2, 8); next = pages.concat([{ id, title, category, content, updatedAt: now }]); }
        else { const targetId = editing && editing.id; next = pages.map((p) => p && p.id === targetId ? { ...p, title, category, content, updatedAt: now } : p); }
        setKnowledge(next); setEditing(null);
      };
      const remove = (p) => { if (!p || !p.id) return; if (!window.confirm('確定要刪除這則知識頁嗎？此動作無法復原。')) return; const next = pages.filter((x) => x && x.id !== p.id); setKnowledge(next); if (editing && editing.id === p.id) setEditing(null); };
      const preview = (v) => { const t = s(v).replace(/\s+/g, ' ').trim(); return t.length > 60 ? t.slice(0, 60) + '…' : t; };
      if (editing) {
        const isNew = editing === 'NEW';
        return (
          <div className="max-w-3xl mx-auto animate-in fade-in duration-300">
            <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
              <div className="flex items-center justify-between mb-6">
                <h2 className="text-lg font-semibold text-slate-800 flex items-center gap-2"><FileText size={20} className="text-indigo-500" /> {isNew ? '新增知識頁' : '編輯知識頁'}</h2>
                <button onClick={() => setEditing(null)} className="p-2 rounded-full hover:bg-slate-100 text-slate-500" title="取消"><X size={18} /></button>
              </div>
              <label className="block text-sm font-medium text-slate-600 mb-1">標題</label>
              <input value={fTitle} onChange={(e) => setFTitle(e.target.value)} placeholder="請輸入標題" className="w-full mb-4 px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-800" />
              <label className="block text-sm font-medium text-slate-600 mb-1">分類</label>
              <input value={fCat} onChange={(e) => setFCat(e.target.value)} placeholder="輸入或沿用既有分類（可留空）" list="kb-cat-list" className="w-full mb-1 px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-800" />
              <datalist id="kb-cat-list">{categories.map((c) => (<option key={c} value={c} />))}</datalist>
              {categories.length > 0 && (<div className="flex flex-wrap gap-1.5 mb-4 mt-2">{categories.map((c) => (<button key={c} onClick={() => setFCat(c)} className="text-xs px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-600 hover:bg-indigo-100">{c}</button>))}</div>)}
              <label className="block text-sm font-medium text-slate-600 mb-1 mt-2">內容</label>
              <textarea value={fContent} onChange={(e) => setFContent(e.target.value)} placeholder="在此輸入內容，支援換行…" rows={12} className="w-full mb-6 px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-800 resize-y leading-relaxed" />
              <div className="flex items-center justify-between gap-3">
                <div>{!isNew && (<button onClick={() => remove(editing)} className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-rose-600 hover:bg-rose-50 font-medium"><Trash2 size={16} /> 刪除</button>)}</div>
                <div className="flex items-center gap-2">
                  <button onClick={() => setEditing(null)} className="px-4 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium">取消</button>
                  <button onClick={save} className="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium shadow-sm"><Check size={16} /> 儲存</button>
                </div>
              </div>
            </div>
          </div>
        );
      }
      const totalCount = pages.length;
      return (
        <div className="flex flex-col md:flex-row gap-4 md:gap-6 h-full min-h-0 animate-in fade-in duration-300">
          <aside className="md:w-60 md:flex-shrink-0">
            <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-4 md:sticky md:top-4">
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-1.5"><BookOpen size={16} className="text-indigo-500" /> 分類</h3>
                <button onClick={() => setCollapsed((v) => !v)} className="md:hidden p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" title="展開／收合"><ChevronDown size={16} className={collapsed ? '' : 'rotate-180 transition-transform'} /></button>
              </div>
              <div className={(collapsed ? 'hidden md:block ' : 'block ') + 'max-h-56 md:max-h-[60vh] overflow-y-auto pr-1 space-y-1'}>
                <button onClick={() => setActiveCat('__ALL__')} className={'w-full text-left px-3 py-2 rounded-xl text-sm flex items-center justify-between ' + (activeCat === '__ALL__' ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-slate-600 hover:bg-slate-50')}><span>全部</span><span className="text-xs text-slate-400">{totalCount}</span></button>
                {categories.map((c) => { const cnt = pages.filter((p) => p && s(p.category).trim() === c).length; return (<button key={c} onClick={() => setActiveCat(c)} className={'w-full text-left px-3 py-2 rounded-xl text-sm flex items-center justify-between ' + (activeCat === c ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-slate-600 hover:bg-slate-50')}><span className="truncate">{c}</span><span className="text-xs text-slate-400 ml-2 flex-shrink-0">{cnt}</span></button>); })}
              </div>
              <button onClick={openNew} className="mt-3 w-full inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl border border-dashed border-indigo-300 text-indigo-600 hover:bg-indigo-50 text-sm font-medium"><Plus size={16} /> 新增知識頁</button>
            </div>
          </aside>
          <main className="flex-1 min-w-0 flex flex-col min-h-0">
            <div className="flex items-center gap-2 mb-4">
              <div className="relative flex-1">
                <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="搜尋標題與內容…" className="w-full pl-9 pr-8 py-2.5 rounded-2xl border border-slate-200 bg-white shadow-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none text-sm text-slate-800" />
                {query && (<button onClick={() => setQuery('')} className="absolute right-2 top-1/2 -translate-y-1/2 p-1 rounded-full hover:bg-slate-100 text-slate-400" title="清除"><X size={14} /></button>)}
              </div>
              <button onClick={openNew} className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium shadow-sm flex-shrink-0"><Plus size={16} /><span className="hidden sm:inline">新增</span></button>
            </div>
            <div className="flex-1 min-h-0 overflow-y-auto pr-1">
              {filtered.length === 0 ? (
                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-10 text-center">
                  <div className="mx-auto w-14 h-14 rounded-2xl bg-indigo-50 flex items-center justify-center mb-4"><BookOpen size={26} className="text-indigo-400" /></div>
                  <p className="text-slate-700 font-medium mb-1">{totalCount === 0 ? '尚無知識頁' : '找不到符合的頁面'}</p>
                  <p className="text-sm text-slate-500 mb-5">{totalCount === 0 ? '把常用的筆記、SOP、聯絡資訊記在這裡，隨時可搜尋。' : '試試換個關鍵字或切換分類。'}</p>
                  {totalCount === 0 && (<button onClick={openNew} className="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium shadow-sm"><Plus size={16} /> 建立第一則知識頁</button>)}
                </div>
              ) : (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                  {filtered.map((p) => (
                    <div key={p.id || Math.random()} onClick={() => openEdit(p)} className="group bg-white rounded-3xl border border-slate-200 shadow-sm p-5 hover:border-indigo-300 hover:shadow-md transition cursor-pointer flex flex-col">
                      <div className="flex items-start justify-between gap-2 mb-2">
                        <h4 className="font-semibold text-slate-800 truncate flex-1">{s(p.title).trim() || '（無標題）'}</h4>
                        <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition flex-shrink-0">
                          <button onClick={(e) => { e.stopPropagation(); openEdit(p); }} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" title="編輯"><Edit2 size={15} /></button>
                          <button onClick={(e) => { e.stopPropagation(); remove(p); }} className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" title="刪除"><Trash2 size={15} /></button>
                        </div>
                      </div>
                      <div className="flex items-center gap-2 mb-2 flex-wrap">
                        {s(p.category).trim() && (<span className="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600">{s(p.category).trim()}</span>)}
                        <span className="text-xs text-slate-400">更新於 {fmtDate(p.updatedAt)}</span>
                      </div>
                      <p className="text-sm text-slate-500 whitespace-pre-wrap line-clamp-2 min-h-0">{preview(p.content) || '（無內容）'}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    };

    // 找重複任務並合併（透過 setTasks 回拋，外層走既有雲端流程。平行 Agent 產出，整合時已回歸測試）
    const DuplicateFinder = ({ tasks, setTasks }) => {
      const list = Array.isArray(tasks) ? tasks.filter(t => t && typeof t === 'object') : [];
      const norm = (s) => String(s == null ? '' : s).toLowerCase().replace(/[\s]+/g, '').replace(/[.,;:!?，。、；：！？「」『』（）()\[\]{}<>"'`~@#$%^&*_+=\-\/\\|]/g, '');
      const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
      const logCount = (t) => (Array.isArray(t && t.logs) ? t.logs.length : 0);
      const createdVal = (t) => { const d = new Date(t && t.createdAt).getTime(); return Number.isFinite(d) ? d : Number.MAX_SAFE_INTEGER; };
      const fmtDate = (v) => { if (!v) return '—'; const d = new Date(v); if (!Number.isFinite(d.getTime())) return String(v); const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}`; };
      const statusLabel = (s) => s === 'done' ? '已完成' : s === 'in-progress' ? '進行中' : s === 'todo' ? '待辦' : (s ? String(s) : '—');
      const statusColor = (s) => s === 'done' ? 'bg-emerald-100 text-emerald-700' : s === 'in-progress' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600';
      const exactGroups = React.useMemo(() => {
        const map = {};
        list.forEach((t) => { const k = norm(t.text); if (!k) return; (map[k] = map[k] || []).push(t); });
        return Object.keys(map).map((k) => map[k]).filter((g) => g.length >= 2).map((g) => g.slice().sort((a, b) => createdVal(a) - createdVal(b)));
      }, [tasks]);
      const similarPairs = React.useMemo(() => {
        const pairs = [];
        for (let i = 0; i < list.length; i++) { for (let j = i + 1; j < list.length; j++) {
          const a = norm(list[i].text); const b = norm(list[j].text);
          if (!a || !b || a === b) continue;
          const shorter = a.length <= b.length ? a : b; const longer = a.length <= b.length ? b : a;
          if (shorter.length >= 4 && longer.indexOf(shorter) !== -1) pairs.push([list[i], list[j]]);
        } }
        return pairs;
      }, [tasks]);
      const mergeGroup = (group, sourceArr) => {
        const sorted = group.slice().sort((a, b) => createdVal(a) - createdVal(b));
        const main = sorted[0]; const others = sorted.slice(1);
        const removeIds = new Set(others.map((t) => t && t.id));
        let mergedLogs = []; sorted.forEach((t) => { if (Array.isArray(t && t.logs)) mergedLogs = mergedLogs.concat(t.logs); });
        const mergedTime = sorted.reduce((sum, t) => sum + num(t && t.timeSpent), 0);
        let mergedStatus = 'todo';
        if (sorted.some((t) => t && t.status === 'done')) mergedStatus = 'done';
        else if (sorted.some((t) => t && t.status === 'in-progress')) mergedStatus = 'in-progress';
        let mergedDeadline = main && main.deadline ? main.deadline : ''; let bestDl = Number.MAX_SAFE_INTEGER;
        sorted.forEach((t) => { const dl = t && t.deadline; if (!dl) return; const d = new Date(dl).getTime(); const v = Number.isFinite(d) ? d : Number.MAX_SAFE_INTEGER; if (v < bestDl) { bestDl = v; mergedDeadline = dl; } });
        const fillFrom = (field) => { if (main && main[field]) return main[field]; for (let i = 0; i < others.length; i++) { if (others[i] && others[i][field]) return others[i][field]; } return main ? main[field] : undefined; };
        const mergedMain = Object.assign({}, main, { logs: mergedLogs, timeSpent: mergedTime, status: mergedStatus, deadline: mergedDeadline, note: fillFrom('note'), assignee: fillFrom('assignee'), category: fillFrom('category') });
        return sourceArr.filter((t) => !(t && removeIds.has(t.id))).map((t) => (t && main && t.id === main.id ? mergedMain : t));
      };
      const handleMergeGroup = (group) => { const removeCount = group.length - 1; if (removeCount < 1) return; if (!window.confirm(`確認合併這組？將保留最早建立的 1 筆、刪除其餘 ${removeCount} 筆（logs 與投入時間會併入保留的任務）。`)) return; setTasks(mergeGroup(group, Array.isArray(tasks) ? tasks : [])); };
      const handleMergeAll = () => { if (!exactGroups.length) return; const totalRemove = exactGroups.reduce((s, g) => s + (g.length - 1), 0); if (!window.confirm(`確認一鍵合併全部 ${exactGroups.length} 組完全重複？總共會刪除 ${totalRemove} 筆重複任務。`)) return; let next = Array.isArray(tasks) ? tasks : []; exactGroups.forEach((g) => { next = mergeGroup(g, next); }); setTasks(next); };
      const TaskRow = ({ t, isMain }) => (
        <div className="flex flex-wrap items-center gap-x-3 gap-y-1 px-3 py-2 rounded-2xl bg-slate-50 border border-slate-100 text-sm">
          {isMain && (<span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 text-xs font-medium"><Check size={12} /> 保留</span>)}
          <span className="font-medium text-slate-800 break-words min-w-0">{(t && t.text) || '（無標題）'}</span>
          <span className={`px-2 py-0.5 rounded-full text-xs ${statusColor(t && t.status)}`}>{statusLabel(t && t.status)}</span>
          {t && t.category ? <span className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-700 text-xs">{t.category}</span> : null}
          <span className="text-xs text-slate-500">建立 {fmtDate(t && t.createdAt)}</span>
          <span className="text-xs text-slate-500">投入 {Math.round(num(t && t.timeSpent))} 分</span>
          <span className="text-xs text-slate-500">{logCount(t)} 筆 log</span>
        </div>
      );
      const hasDup = exactGroups.length > 0 || similarPairs.length > 0;
      return (
        <div className="max-w-3xl mx-auto p-4 space-y-4 animate-in fade-in duration-300">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Copy size={20} className="text-indigo-600" /> 找重複任務並合併</h2>
              <p className="text-sm text-slate-500 mt-1">完全重複 {exactGroups.length} 組・疑似相似 {similarPairs.length} 組</p>
            </div>
            {exactGroups.length > 0 && (<button onClick={handleMergeAll} className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium shadow-sm transition"><Check size={16} /> 全部完全重複組一鍵合併</button>)}
          </div>
          {!hasDup && (<div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-10 text-center"><CheckCircle size={40} className="text-emerald-500 mx-auto mb-3" /><p className="text-slate-600 font-medium">沒有偵測到重複任務 🎉</p><p className="text-sm text-slate-400 mt-1">你的任務清單很乾淨。</p></div>)}
          <div className="space-y-4 max-h-[70vh] overflow-y-auto pr-1">
            {exactGroups.length > 0 && (
              <div className="space-y-3">
                <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-2"><AlertTriangle size={16} className="text-amber-500" /> 完全重複（可合併）</h3>
                {exactGroups.map((group, gi) => (
                  <div key={`exact-${gi}`} className="bg-white rounded-3xl border border-slate-200 shadow-sm p-4">
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                      <span className="text-sm font-medium text-slate-600">組 {gi + 1}・{group.length} 筆</span>
                      <button onClick={() => handleMergeGroup(group)} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-2xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-medium transition"><Copy size={14} /> 合併此組</button>
                    </div>
                    <div className="space-y-2">{group.map((t, ti) => (<TaskRow key={(t && t.id) || `g${gi}-${ti}`} t={t} isMain={ti === 0} />))}</div>
                  </div>
                ))}
              </div>
            )}
            {similarPairs.length > 0 && (
              <div className="space-y-3">
                <h3 className="text-sm font-semibold text-slate-700 flex items-center gap-2"><AlertTriangle size={16} className="text-sky-500" /> 疑似相似（僅提示，請人工判斷）</h3>
                {similarPairs.map((pair, pi) => (
                  <div key={`sim-${pi}`} className="bg-white rounded-3xl border border-slate-200 shadow-sm p-4">
                    <div className="text-sm font-medium text-slate-600 mb-3">疑似相似組 {pi + 1}</div>
                    <div className="space-y-2">{pair.map((t, ti) => (<TaskRow key={(t && t.id) || `p${pi}-${ti}`} t={t} isMain={false} />))}</div>
                    <p className="text-xs text-slate-400 mt-2">此組不提供自動合併，請自行確認是否為同一任務。</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    // 已完成任務（唯讀，依分類分組彙整。平行 Agent 產出，整合時修正分類查詢改用名稱、已回歸測試）
    const CompletedTasks = ({ tasks, projects }) => {
      const { useState, useMemo } = React;
      const safeArr = (v) => (Array.isArray(v) ? v : []);
      const safeNum = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
      const fmtDate = (v) => { if (!v) return '—'; const d = new Date(v); if (isNaN(d.getTime())) return '—'; try { return d.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }); } catch (e) { return '—'; } };
      const getDoneTime = (t) => { const logs = safeArr(t && t.logs); for (let i = logs.length - 1; i >= 0; i--) { const end = logs[i] && logs[i].end; if (end) { const d = new Date(end); if (!isNaN(d.getTime())) return d.getTime(); } } if (t && t.createdAt) { const d = new Date(t.createdAt); if (!isNaN(d.getTime())) return d.getTime(); } return null; };
      const getDoneTimeLabel = (t) => { const ms = getDoneTime(t); return ms == null ? '—' : fmtDate(ms); };
      const getMinutes = (t) => safeNum(t && t.timeSpent);
      const projectList = safeArr(projects);
      // 本專案 task.category 存的是專案「名稱」→ 用名稱查（非 id）
      const projByName = useMemo(() => { const m = {}; projectList.forEach((p) => { if (p && p.name != null) m[String(p.name)] = p; }); return m; }, [projectList]);
      const catMeta = (catId) => { const p = projByName[String(catId)]; const name = (p && p.name) || (catId ? String(catId) : '未分類'); const color = (p && p.color) || '#94a3b8'; return { name, color }; };
      const doneTasks = useMemo(() => safeArr(tasks).filter((t) => t && t.status === 'done'), [tasks]);
      const [keyword, setKeyword] = useState('');
      const kw = keyword.trim().toLowerCase();
      const filtered = useMemo(() => { if (!kw) return doneTasks; return doneTasks.filter((t) => { const text = String((t && t.text) || '').toLowerCase(); const cat = catMeta(t && t.category).name.toLowerCase(); const assignee = String((t && t.assignee) || '').toLowerCase(); return text.includes(kw) || cat.includes(kw) || assignee.includes(kw); }); }, [doneTasks, kw, projByName]);
      const groups = useMemo(() => {
        const map = {};
        filtered.forEach((t) => { const key = t && t.category != null ? String(t.category) : '__none__'; if (!map[key]) { const meta = catMeta(t && t.category); map[key] = { key, name: meta.name, color: meta.color, items: [], minutes: 0 }; } map[key].items.push(t); map[key].minutes += getMinutes(t); });
        const arr = Object.values(map);
        arr.forEach((g) => { g.items.sort((a, b) => { const ta = getDoneTime(a); const tb = getDoneTime(b); if (ta == null && tb == null) return 0; if (ta == null) return 1; if (tb == null) return -1; return tb - ta; }); });
        arr.sort((a, b) => b.items.length - a.items.length);
        return arr;
      }, [filtered, projByName]);
      const [collapsed, setCollapsed] = useState(() => new Set());
      const toggle = (key) => { setCollapsed((prev) => { const next = new Set(prev); if (next.has(key)) next.delete(key); else next.add(key); return next; }); };
      const totalCount = doneTasks.length;
      const totalMinutes = useMemo(() => doneTasks.reduce((s, t) => s + getMinutes(t), 0), [doneTasks]);
      const totalHours = (totalMinutes / 60).toFixed(1);
      const catCount = useMemo(() => { const s = new Set(); doneTasks.forEach((t) => s.add(t && t.category != null ? String(t.category) : '__none__')); return s.size; }, [doneTasks]);
      const SummaryCard = ({ icon, value, label, tint }) => (
        <div className="flex-1 min-w-[130px] bg-white rounded-3xl border border-slate-200 shadow-sm p-4 flex items-center gap-3">
          <div className={'w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ' + tint}>{icon}</div>
          <div className="min-w-0"><div className="text-2xl font-bold text-slate-800 leading-tight">{value}</div><div className="text-xs text-slate-500 truncate">{label}</div></div>
        </div>
      );
      return (
        <div className="space-y-5 animate-in fade-in duration-300 pb-12">
          <div className="flex flex-wrap gap-3">
            <SummaryCard icon={<CheckCircle className="w-5 h-5 text-indigo-600" />} value={totalCount} label="已完成任務" tint="bg-indigo-50" />
            <SummaryCard icon={<Clock className="w-5 h-5 text-sky-600" />} value={totalHours + ' h'} label="總投入時數" tint="bg-sky-50" />
            <SummaryCard icon={<Calendar className="w-5 h-5 text-slate-600" />} value={catCount} label="涵蓋分類" tint="bg-slate-100" />
          </div>
          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-3">
            <div className="relative">
              <Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
              <input type="text" value={keyword} onChange={(e) => setKeyword(e.target.value)} placeholder="搜尋任務、分類或負責人…" className="w-full pl-9 pr-9 py-2 rounded-2xl bg-slate-50 border border-slate-200 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-300" />
              {keyword && (<button onClick={() => setKeyword('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" aria-label="清除"><X className="w-4 h-4" /></button>)}
            </div>
          </div>
          {groups.length === 0 ? (
            <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-10 flex flex-col items-center justify-center text-center">
              <div className="w-14 h-14 rounded-full bg-indigo-50 flex items-center justify-center mb-3"><CheckCircle className="w-7 h-7 text-indigo-400" /></div>
              <div className="text-slate-700 font-semibold mb-1">{kw ? '找不到符合的已完成任務' : '尚無已完成任務'}</div>
              <div className="text-sm text-slate-500">{kw ? '換個關鍵字再試試看。' : '完成任務後就會彙整在這裡囉！'}</div>
            </div>
          ) : (
            <div className="space-y-4">
              {groups.map((g) => {
                const isOpen = !collapsed.has(g.key);
                return (
                  <div key={g.key} className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                    <button onClick={() => toggle(g.key)} className="w-full flex items-center gap-3 px-5 py-4 hover:bg-slate-50 transition-colors text-left">
                      <span className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: g.color }} />
                      <span className="font-semibold text-slate-800 truncate">{g.name}</span>
                      <span className="text-xs font-medium text-indigo-600 bg-indigo-50 rounded-full px-2 py-0.5 shrink-0">{g.items.length} 件</span>
                      <span className="text-xs text-slate-400 shrink-0 hidden sm:inline">{Math.round(g.minutes)} 分鐘</span>
                      <ChevronDown className={'w-5 h-5 text-slate-400 ml-auto shrink-0 transition-transform ' + (isOpen ? 'rotate-180' : '')} />
                    </button>
                    {isOpen && (
                      <div className="border-t border-slate-100 divide-y divide-slate-100 max-h-[420px] overflow-y-auto">
                        {g.items.map((t, idx) => (
                          <div key={(t && t.id != null ? t.id : 'idx') + '-' + idx} className="px-5 py-3">
                            <div className="text-sm font-medium text-slate-800 break-words">{String((t && t.text) || '（無標題）')}</div>
                            <div className="mt-1.5 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-500">
                              <span className="inline-flex items-center gap-1"><Calendar className="w-3.5 h-3.5 text-slate-400" />{getDoneTimeLabel(t)}</span>
                              <span className="inline-flex items-center gap-1"><Clock className="w-3.5 h-3.5 text-slate-400" />{Math.round(getMinutes(t))} 分鐘</span>
                              {t && t.assignee ? (<span className="inline-flex items-center gap-1 text-slate-600">{String(t.assignee)}</span>) : null}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    // 工作台：今日集中 / 暫緩 / 未指定（透過 setTasks 只改 zone 欄位回拋。平行 Agent 產出，整合時已回歸測試）
    const FocusZones = ({ tasks, setTasks }) => {
      const list = Array.isArray(tasks) ? tasks : [];
      const active = list.filter((t) => t && t.status !== 'done');
      const zoneOf = (t) => { const z = t && t.zone; return z === 'focus' || z === 'hold' ? z : 'none'; };
      const focusTasks = active.filter((t) => zoneOf(t) === 'focus');
      const holdTasks = active.filter((t) => zoneOf(t) === 'hold');
      const noneTasks = active.filter((t) => zoneOf(t) === 'none');
      const moveTo = (taskId, nextZone) => { setTasks(list.map((t) => { if (!t || t.id !== taskId) return t; const z = nextZone === 'focus' || nextZone === 'hold' ? nextZone : undefined; return { ...t, zone: z }; })); };
      const fmtDeadline = (d) => { if (!d) return ''; try { const dt = new Date(d); if (isNaN(dt.getTime())) return String(d); const mm = String(dt.getMonth() + 1).padStart(2, '0'); const dd = String(dt.getDate()).padStart(2, '0'); return `${dt.getFullYear()}/${mm}/${dd}`; } catch (e) { return String(d); } };
      const FZCard = ({ task, zone }) => {
        if (!task) return null;
        const text = task.text || '(未命名任務)'; const category = task.category || ''; const deadline = task.deadline ? fmtDeadline(task.deadline) : '';
        return (
          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-4 flex flex-col gap-3">
            <p className="text-sm font-medium text-slate-800 break-words leading-relaxed">{text}</p>
            {(category || deadline) && (
              <div className="flex flex-wrap items-center gap-2 text-xs">
                {category && (<span className="px-2 py-0.5 rounded-full bg-sky-50 text-sky-700 border border-sky-100">{category}</span>)}
                {deadline && (<span className="inline-flex items-center gap-1 text-slate-500"><Clock size={12} />{deadline}</span>)}
              </div>
            )}
            <div className="flex flex-wrap items-center gap-2 pt-1">
              {zone !== 'focus' && (<button type="button" onClick={() => moveTo(task.id, 'focus')} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-600 text-white hover:bg-indigo-700 transition-colors"><Zap size={12} />集中</button>)}
              {zone !== 'hold' && (<button type="button" onClick={() => moveTo(task.id, 'hold')} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-700 hover:bg-amber-200 transition-colors"><PauseCircle size={12} />暫緩</button>)}
              {zone !== 'none' && (<button type="button" onClick={() => moveTo(task.id, undefined)} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-500 hover:bg-slate-200 transition-colors"><X size={12} />移除</button>)}
            </div>
          </div>
        );
      };
      const Column = ({ zoneKey, title, icon, items, accent }) => {
        const styles = accent ? { wrap: 'bg-indigo-50/60 border-indigo-300', head: 'text-indigo-700', badge: 'bg-indigo-600 text-white', iconWrap: 'bg-indigo-100 text-indigo-600' } : { wrap: 'bg-white border-slate-200', head: 'text-slate-700', badge: 'bg-slate-200 text-slate-600', iconWrap: 'bg-slate-100 text-slate-500' };
        const Icon = icon;
        return (
          <div className={`rounded-3xl border shadow-sm flex flex-col ${styles.wrap}`}>
            <div className="flex items-center justify-between px-4 pt-4 pb-3">
              <div className="flex items-center gap-2"><span className={`inline-flex items-center justify-center w-7 h-7 rounded-full ${styles.iconWrap}`}><Icon size={16} /></span><span className={`text-sm font-semibold ${styles.head}`}>{title}</span></div>
              <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${styles.badge}`}>{items.length}</span>
            </div>
            <div className="px-3 pb-3 flex flex-col gap-3 overflow-y-auto" style={{ maxHeight: '60vh' }}>
              {items.length === 0 ? (<div className="text-center text-xs text-slate-400 py-8 px-2">{accent ? '把今天要專心做的任務放進來' : zoneKey === 'hold' ? '沒有暫緩中的任務' : '沒有未指定的任務'}</div>) : (items.map((t) => <FZCard key={t.id} task={t} zone={zoneKey} />))}
            </div>
          </div>
        );
      };
      return (
        <div className="w-full animate-in fade-in duration-300">
          <div className="flex items-start gap-2 mb-4 px-1"><Plus size={16} className="text-indigo-500 mt-0.5 shrink-0" /><p className="text-sm text-slate-600">把今天要專心做的放進「今日集中」，先擱著的放「暫緩」（點卡片上的按鈕移動即可）。</p></div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <Column zoneKey="focus" title="今日集中" icon={Zap} items={focusTasks} accent />
            <Column zoneKey="hold" title="暫緩" icon={PauseCircle} items={holdTasks} accent={false} />
            <Column zoneKey="none" title="未指定" icon={CheckCircle} items={noneTasks} accent={false} />
          </div>
        </div>
      );
    };

    function TaskManager({ uid, userEmail }) {
      const [activeView, setActiveView] = useState('board');
      const [searchQuery, setSearchQuery] = useState('');
      const [sheetSort, setSheetSort] = useState({ key: 'createdAt', dir: 'desc' }); // 任務總表排序
      const [isSidebarOpen, setIsSidebarOpen] = useState(() => (typeof window !== 'undefined' ? window.innerWidth >= 1024 : true));
      const [isLoaded, setIsLoaded] = useState(false);
      
      const [tasks, setTasks] = useState([]);
      const [projects, setProjects] = useState(DEFAULT_PROJECTS);
      const [users, setUsers] = useState(DEFAULT_USERS);
      const [notes, setNotes] = useState([]);
      const [knowledge, setKnowledge] = useState([]);

      const [dialog, setDialog] = useState(null); 
      const [filterType, setFilterType] = useState('all'); 
      const [filterProject, setFilterProject] = useState('ALL'); 
      
      const [newTaskInput, setNewTaskInput] = useState('');
      const [newTaskType, setNewTaskType] = useState('work'); 
      const [newTaskProject, setNewTaskProject] = useState('ALL');
      const [newTaskPeriod, setNewTaskPeriod] = useState('不指定時段');
      const [newTaskDeadline, setNewTaskDeadline] = useState('');

      const [activeTimer, setActiveTimer] = useState(null);
      const [timerTick, setTimerTick] = useState(0);

      const [settingsNewUser, setSettingsNewUser] = useState('');
      const [settingsNewProject, setSettingsNewProject] = useState('');
      const [editingProject, setEditingProject] = useState(null);
      const [editingProjectName, setEditingProjectName] = useState('');

      const [statsRange, setStatsRange] = useState('thisWeek');
      // 自訂查詢期間（YYYY-MM-DD），預設為今天
      const toDateInput = (d) => d.toLocaleDateString('sv-SE');   // sv-SE 會給出 YYYY-MM-DD 且用當地時間
      const [customStart, setCustomStart] = useState(() => toDateInput(new Date()));
      const [customEnd, setCustomEnd] = useState(() => toDateInput(new Date()));
      const [draggedNoteIndex, setDraggedNoteIndex] = useState(null);
      const fileInputRef = useRef(null);
      // 雲端同步用：
      const syncedJsonRef = useRef(null);   // 最後一次與雲端一致的內容（healed 後），避免多餘回寫
      const saveTimerRef = useRef(null);     // 去抖計時器
      const canWriteRef = useRef(false);     // 只有「成功讀過一次雲端」後才允許寫；讀失敗時保持 false，避免用空資料覆蓋雲端
      const lastWriteIdRef = useRef(null);   // 標記「這筆是我自己寫的」，用來精準略過自己的回音（比 JSON 比對可靠）
      const flushSaveRef = useRef(() => {}); // 指向最新的「立即存檔」函式，供關頁前 flush 呼叫
      const [syncStatus, setSyncStatus] = useState('idle'); // idle | saving | saved | error

      // 產生目前本地完整內容（供比對與寫入共用）
      const buildLocalPayload = () => {
        let catMap = {};
        try { catMap = JSON.parse(localStorage.getItem('taskflow_catmap') || '{}'); } catch (e) {}
        return { tasks, projects, users, notes, catMap, knowledge };
      };

      // 立即把待寫資料寫回雲端（去抖到期、或關頁前 flush 都走這裡）
      flushSaveRef.current = () => {
        if (!uid || !canWriteRef.current) return;              // 尚未成功讀過雲端 → 絕不寫，避免覆蓋真資料
        if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); saveTimerRef.current = null; }
        const payload = buildLocalPayload();
        const localJson = JSON.stringify(payload);
